<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة اللجنة</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
.wrap{max-width:1180px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:7px 14px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.team{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.team{box-shadow:var(--shadow)}
.team.fin{border-inline-start:4px solid var(--gold)}
.sum{display:grid;grid-template-columns:44px 1fr auto auto auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}
.sum::-webkit-details-marker{display:none}
.rk{font-size:22px;font-weight:700;color:var(--muted);text-align:center}
.num{text-align:center;min-width:64px}
.num b{display:block;font-size:20px;color:var(--navy);font-variant-numeric:tabular-nums}
.num small{color:var(--muted);font-size:11.5px}
/* عمود المحتوى لا يتمدد بالنصوص الطويلة، وعمود التقييم بعرض ثابت لا يُقص */
.body{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px);gap:18px;align-items:start}
.body>*{min-width:0}
@media (max-width:760px){.body{grid-template-columns:1fr}.sum{grid-template-columns:34px 1fr auto}.sum .hide-sm{display:none}}
.field{margin-bottom:12px}
.field h4{font-size:13px;color:var(--muted);font-weight:500}
.field p{white-space:pre-wrap;overflow-wrap:anywhere}
.rrow{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13.5px;margin:5px 0}
.rrow b{text-align:left}
.box{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:12px}
.scoreform{display:grid;grid-template-columns:100px 1fr;gap:8px}
.jl div{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
a{color:var(--accent)}
.top h1{display:flex;align-items:center;gap:10px}
.top h1 .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--navy);color:#fff;font-size:20px}
.login{max-width:420px;margin:12vh auto}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.filebtn{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--text);text-decoration:none;font-size:14px}
.filebtn.deck{border-color:var(--accent);color:var(--accent);font-weight:700}
.crit{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.crit small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.crit input{padding:8px 10px;text-align:center}
.tot{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:700}
.coi{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin:8px 0;cursor:pointer}
.coi input{width:18px;height:18px;accent-color:var(--bad)}
.prog{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px}
.ann{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.done-badge{font-size:12px;color:var(--good);font-weight:700}
</style>
</head>
<body data-noannounce>
<div class="wrap">
  <div id="loginView" class="card login hidden">
    <div style="text-align:center;margin-bottom:8px"><span style="display:inline-grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--navy);color:#fff;font-size:24px"><i data-icon="scale"></i></span></div>
    <h1 style="font-size:24px;text-align:center">لوحة لجنة التحكيم</h1>
    <p class="muted" data-text="hackathon.name" style="text-align:center"></p>
    <label for="jKey">مفتاحك الشخصي</label>
    <input id="jKey" type="password" dir="ltr" autocomplete="current-password">
    <div id="nameWrap" class="hidden"><label for="jName">اسمك (للمفتاح المشترك)</label><input id="jName" maxlength="40" placeholder="مثال: د. أحمد"></div>
    <button class="btn" id="loginBtn" style="margin-top:14px">دخول</button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="mainView" class="hidden">
    <div class="top">
      <div><h1 style="font-size:24px"><span class="ic"><i data-icon="scale"></i></span> لوحة لجنة التحكيم</h1><div class="muted small" id="meta"></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm ghost" id="refreshBtn"><i data-icon="refresh-cw"></i> تحديث</button><a class="btn sm" id="winBtn" href="winners.html" target="_blank"><i data-icon="trophy"></i> شاشة الإعلان</a><button class="btn sm ghost" id="logoutBtn">خروج</button></div>
    </div>
    <div id="annBox"></div>
    <div class="card" id="progressCard"></div>
    <div class="card small muted" id="guide"></div>
    <div class="tabs"><button class="on" data-f="todo">بانتظار تقييمي</button><button data-f="done">تم تقييمها</button><button data-f="fin">كل المتأهلين</button><button data-f="all">كل المشاريع</button><button data-f="flag">مشاريع مُعلَّمة</button></div>
    <div class="tabs" id="trTabs" hidden></div>
    <div id="list"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = APP.esc;
const SS = { get(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v) }catch(e){} } };
let KEY = SS.get("jk"), NAME = SS.get("jn") || "", DATA = null, filter = "todo", trf = "", open = new Set();

async function api(action, body){
  const r = await fetch(`api/hack?action=${action}${!body && NAME ? "&name="+encodeURIComponent(NAME) : ""}`, {method: body?"POST":"GET", headers:{"Content-Type":"application/json","x-judge-key":KEY}, body: body?JSON.stringify({...body, judge: NAME}):undefined});
  const d = await r.json().catch(()=>({error:"تعذر الاتصال"}));
  if (!r.ok) throw new Error(d.error||"خطأ");
  return d;
}
$("loginBtn").onclick = async () => {
  KEY = $("jKey").value.trim(); NAME = $("jName").value.trim(); $("loginErr").textContent = "";
  try {
    await load();
    if (!DATA.me.personal && !DATA.me.admin && !NAME) { $("nameWrap").classList.remove("hidden"); $("mainView").classList.add("hidden"); $("loginView").classList.remove("hidden"); return $("loginErr").textContent = "هذا مفتاح مشترك: اكتب اسمك ثم ادخل"; }
    SS.set("jk", KEY); SS.set("jn", NAME);
  } catch(e){ $("loginErr").textContent = e.message; }
};
$("jKey").onkeydown = e => { if (e.key === "Enter") $("loginBtn").click(); };
$("logoutBtn").onclick = () => { SS.set("jk", null); SS.set("jn", null); location.reload(); };
document.querySelectorAll(".tabs button[data-f]").forEach(b=>b.onclick=()=>{ filter=b.dataset.f; document.querySelectorAll(".tabs button[data-f]").forEach(x=>x.classList.toggle("on",x===b)); render(); });
$("refreshBtn").onclick = () => load();

async function load(){
  DATA = await api("judge");
  $("loginView").classList.add("hidden"); $("mainView").classList.remove("hidden");
  const c = DATA.config.hackathon, me = DATA.me;
  // شاشة الإعلان: للإدارة والمفتاح المشترك، وللمحكّمين بعد إغلاق التحكيم فقط
  $("winBtn").style.display = (me.personal && DATA.open !== false && !c.resultsPublished) ? "none" : "";
  const mode = c.judging?.mode || "tracks";
  const tr = mode === "committees" ? "المشاريع المسندة إليك" : mode === "all" ? "كل المشاريع" : me.tracks?.length ? me.tracks.map(id => c.tracks.find(t=>t.id===id)?.title).filter(Boolean).join("، ") : "كل المسارات";
  $("meta").textContent = `${me.admin ? "الإدارة (عرض فقط)" : me.name} · ${tr} · ${DATA.stats.teams} فريق`;
  $("annBox").innerHTML = (DATA.announcements||[]).map(a=>`<div class="ann"><b><i data-icon="megaphone"></i> ${esc(a.title)}</b>${a.body?`<br><span class="small" style="white-space:pre-wrap">${esc(a.body)}</span>`:""}</div>`).join("");
  const p = DATA.progress, pct = p.total ? Math.round(p.done/p.total*100) : 0;
  $("progressCard").innerHTML = me.admin ? `<b>عرض الإدارة</b><div class="muted small">ترى كل المشاريع ودرجات المحكّمين، والتقييم للمحكّمين فقط.</div>` :
    `<div style="display:flex;justify-content:space-between"><b>تقدّمك في التقييم</b><b class="gold">${p.done} / ${p.total}</b></div><div class="prog"><i style="width:${pct}%"></i></div>${p.done===p.total&&p.total?`<p class="small" style="color:var(--good);margin-top:6px">✓ أنهيت تقييم كل المتأهلين المسندين إليك. شكرًا لك!</p>`:""}`;
  $("guide").innerHTML = (DATA.open === false ? `<div class="ann" style="margin-bottom:8px"><b><i data-icon="lock"></i> التحكيم مغلق حاليًا</b><br><span class="small">يمكنك الاطلاع على المشاريع وتقييماتك، ولا يمكن الحفظ أو التعديل.</span></div>` : "") + `قيّم كل مشروع متأهل <b>لكل معيار</b> وفق المعايير المعلنة، ويُحسب المجموع من 100 تلقائيًا. إذا كانت لديك علاقة بأحد أعضاء الفريق فحدّد <b>«لدي تعارض مصالح»</b> ولن تُحتسب درجتك. الدرجة النهائية = ${c.weights.ai}% تقييم الذكاء الاصطناعي + ${c.weights.judges}% متوسط درجات اللجنة. ${DATA.open === false ? "" : "يمكنك تعديل تقييمك بإعادة الحفظ."}`;
  render();
}
// الفرز حسب المسار: يظهر فقط إذا كانت المشاريع المعروضة من أكثر من مسار
function trackTabs(){
  const TR = DATA.config.hackathon.tracks || [], ids = new Set(DATA.rows.map(r=>r.track).filter(Boolean)), el = $("trTabs");
  const shown = TR.filter(t=>ids.has(t.id));
  if (shown.length < 2) { el.hidden = true; trf = ""; return; }
  if (trf && !ids.has(trf)) trf = "";
  el.hidden = false;
  el.innerHTML = `<button data-t="" class="${trf?"":"on"}">كل المسارات</button>` + shown.map(t=>`<button data-t="${esc(t.id)}" class="${trf===t.id?"on":""}">${glyph(t.icon)} ${esc(t.title)}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{ trf=b.dataset.t; render(); });
}
// رسالة قصيرة تختفي تلقائيًا
function toast(t){ let el = document.getElementById("toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .4s"; document.body.appendChild(el); } el.textContent = t; el.style.opacity = "1"; clearTimeout(el._t); el._t = setTimeout(() => el.style.opacity = "0", 4000); }
function render(){
  const R = DATA.config.hackathon.rubric, me = DATA.me;
  trackTabs();
  const rows = DATA.rows.filter(r => !trf || r.track===trf).filter(r => filter==="all" ? true : filter==="flag" ? r.submission.flagged : filter==="todo" ? (r.finalist && !r.mine) : filter==="done" ? Boolean(r.mine) : r.finalist);
  // عدد المشاريع في كل تبويب، ليعرف المحكّم أين ذهبت المشاريع التي قيّمها
  const base = DATA.rows.filter(r => !trf || r.track===trf), cnt = {todo: base.filter(r=>r.finalist && !r.mine).length, done: base.filter(r=>r.mine).length, fin: base.filter(r=>r.finalist).length, all: base.length, flag: base.filter(r=>r.submission.flagged).length};
  document.querySelectorAll(".tabs button[data-f]").forEach(b => { b.dataset.l = b.dataset.l || b.textContent; b.textContent = `${b.dataset.l} (${cnt[b.dataset.f] ?? 0})`; });
  if (!rows.length) { $("list").innerHTML = `<div class="card muted">${filter==="todo" ? (DATA.rows.some(r=>r.mine) ? "أحسنت! قيّمت كل المشاريع المسندة إليك. تجد تقييماتك في تبويب «تم تقييمها»، ويمكنك تعديلها ما دام التحكيم مفتوحًا." : "لا توجد مشاريع بانتظار تقييمك.") : filter==="done" ? "لم تقيّم أي مشروع بعد." : "لا توجد مشاريع في هذا القسم."}</div>`; return; }
  $("list").innerHTML = rows.map(r => {
    const s = r.submission, mine = r.mine;
    const form = r.finalist && !me.admin ? `<div class="box"><b>تقييمك${mine ? (mine.coi ? " · تعارض مصالح" : ` · ${mine.score}/100`) : ""}</b>
        ${R.map(x=>`<div class="crit"><span>${esc(x.label)} <small>${esc(x.guide||"")}</small></span><input type="number" min="0" max="${x.max}" data-c="${x.key}" placeholder="0–${x.max}" value="${mine?.criteria?.[x.key] ?? ""}" dir="ltr"></div>`).join("")}
        <div class="tot"><span>المجموع</span><span class="gold"><span class="sum-out">${mine && !mine.coi ? mine.score : 0}</span> / 100</span></div>
        <textarea class="nt" maxlength="600" placeholder="ملاحظاتك للفريق أو للجنة (اختياري)" style="min-height:70px">${esc(mine?.note ?? "")}</textarea>
        <label class="coi"><input type="checkbox" class="coi-in" ${mine?.coi?"checked":""}> لدي تعارض مصالح مع هذا الفريق</label>
        ${DATA.open === false ? `<p class="muted small" style="margin-top:8px"><i data-icon="lock"></i> التحكيم مغلق</p>` : `<button class="btn sm save" style="width:100%">${mine ? "تحديث التقييم" : "حفظ التقييم"}</button>`}<p class="err msg"></p></div>` : "";
    return `<details class="team ${r.finalist?"fin":""}" data-id="${r.id}" ${open.has(r.id)?"open":""}>
      <summary class="sum">
        <span class="rk">${r.order ?? r.rank}</span>
        <span><b>${esc(r.team)}</b> ${r.finalist?'<span class="pill">متأهل</span>':""} ${mine?'<span class="done-badge">✓ قيّمته</span>':""} ${s.flagged?'<span class="pill no"><i data-icon="triangle-alert"></i> محاولة تلاعب محتملة</span>':""}
          <div class="muted small">${esc(s.title)} · ${esc(r.challenge)} · ${r.attempts} محاولة</div></span>
        <span class="num"><b>${s.total}</b><small>الذكاء الاصطناعي</small></span>
        ${me.admin ? `<span class="num hide-sm"><b>${r.judgeAvg ?? "—"}</b><small>اللجنة (${r.judges.filter(j=>!j.coi).length})</small></span>
        <span class="num hide-sm"><b>${r.final ?? "—"}</b><small>النهائية</small></span>` : `<span class="num hide-sm"><b>${mine ? (mine.coi ? "—" : mine.score) : "—"}</b><small>تقييمك</small></span>`}
      </summary>
      <div class="body">
        <div>
          ${[["المشكلة","problem"],["الحل","solution"],["العميل والسوق","customer"],["نموذج الربح","business"],["النموذج الأولي","prototype_desc"]].map(([l,k])=>s[k]?`<div class="field"><h4>${l}</h4><p>${esc(s[k])}</p></div>`:"").join("")}
          ${s.prototype_url?`<div class="field"><h4>رابط النموذج</h4><a href="${esc(s.prototype_url)}" target="_blank" rel="noopener" dir="ltr">${esc(s.prototype_url)}</a></div>`:""}
          ${s.video_url?`<div class="field"><h4>فيديو العرض</h4><a href="${esc(s.video_url)}" target="_blank" rel="noopener" dir="ltr">${esc(s.video_url)}</a></div>`:""}
          <div class="field"><h4>الملفات المرفقة</h4>${(s.files||[]).length ? `<div class="fl">${s.files.map(f=>`<a class="filebtn ${f.kind==="deck"?"deck":""}" href="${esc(f.url||"#")}" target="_blank" rel="noopener">${f.kind==="deck"?'<i data-icon="presentation"></i> العرض الاستثماري':'<i data-icon="paperclip"></i> '+esc(f.name)}</a>`).join("")}</div>${s.deck_read?`<p class="small" style="color:var(--good);margin-top:4px">✓ قرأ الذكاء الاصطناعي العرض الاستثماري</p>`:""}` : `<p class="muted small">لا توجد ملفات</p>`}</div>
          <div class="field"><h4>الفريق</h4><p>${esc((r.members||[]).join("، "))}</p></div>
        </div>
        <div>
          ${form}
          <div class="box"><b>تقييم الذكاء الاصطناعي: ${s.total}/100</b>
            ${R.map(x=>{const v=s.scores?.[x.key]??0; const dt=s.feedback?.details?.[x.key]; return `<div class="rrow"><span>${esc(x.label)}</span><div class="bar"><i style="width:${v/x.max*100}%"></i></div><b>${v}/${x.max}</b></div>${dt?.reason?`<div class="small muted" style="margin:-2px 0 8px">${dt.capped?'<i data-icon="lock"></i> ':""}${esc(dt.reason)}${dt.evidence?`<br><i>«${esc(dt.evidence)}»</i>`:""}</div>`:""}`}).join("")}
            ${(s.feedback?.caps||[]).length?`<p class="small" style="color:var(--bad)"><i data-icon="lock"></i> ${s.feedback.caps.map(esc).join("، ")}</p>`:""}${s.feedback?.reviewed?`<p class="small muted"><i data-icon="shield-check"></i> خضع لمراجعة ثانية</p>`:""}${s.feedback?.demo?`<p class="small" style="color:var(--bad);font-weight:700"><i data-icon="triangle-alert"></i> تقييم وهمي (الذكاء الاصطناعي غير مفعّل)</p>`:""}
            <p class="small" style="margin-top:8px">${esc(s.feedback?.summary)}</p>
          </div>
          ${me.admin && r.judges.length?`<div class="box jl"><b>درجات اللجنة</b>${r.judges.map(j=>`<div><span>${esc(j.judge)}${j.note?` <span class="muted small">— ${esc(j.note)}</span>`:""}</span><b class="gold">${j.coi?"تعارض":j.score}</b></div>`).join("")}</div>`:""}
        </div>
      </div></details>`;
  }).join("");
  document.querySelectorAll("details.team").forEach(d=>{
    const id = Number(d.dataset.id);
    d.ontoggle = () => d.open ? open.add(id) : open.delete(id);
    const btn = d.querySelector(".save"); if (!btn) { d.querySelectorAll(".box input,.box textarea").forEach(i=>i.disabled=true); return; }
    const ins = [...d.querySelectorAll("[data-c]")], out = d.querySelector(".sum-out"), coi = d.querySelector(".coi-in");
    const recalc = () => { out.textContent = coi.checked ? 0 : ins.reduce((a,i)=>a+(Number(i.value)||0),0); ins.forEach(i=>i.disabled=coi.checked); };
    ins.forEach(i=>i.oninput=recalc); coi.onchange=recalc; recalc();
    btn.onclick = async () => {
      const msg = d.querySelector(".msg"); msg.textContent="";
      if (!coi.checked && ins.some(i=>i.value==="")) { msg.textContent = "قيّم كل المعايير"; return; }
      btn.disabled = true;
      try { await api("score", {team_id:id, coi: coi.checked, criteria: Object.fromEntries(ins.map(i=>[i.dataset.c, Number(i.value)])), note: d.querySelector(".nt").value}); await load(); toast(filter==="todo" ? "✓ حُفظ تقييمك، وانتقل المشروع إلى تبويب «تم تقييمها»" : "✓ حُفظ تقييمك"); }
      catch(e){ msg.textContent = e.message; btn.disabled = false; }
    };
  });
}
APP.ready.then(() => { if (KEY) load().catch(()=>$("loginView").classList.remove("hidden")); else $("loginView").classList.remove("hidden"); });
</script>
</body>
</html>
