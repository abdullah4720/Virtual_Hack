<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مرحبًا</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
.wrap{max-width:900px;margin-top:-34px;position:relative}
.topbar .in{padding:30px 16px 64px;max-width:900px}
.topbar h1{font-size:32px}
.topbar .ev{color:rgba(255,255,255,.72);font-size:14px;margin-top:2px}
.topbar .about{color:rgba(255,255,255,.85);max-width:620px;margin:14px auto 0;line-height:1.95;font-size:15.5px}
.portals{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media (max-width:680px){.portals{grid-template-columns:1fr}}
.portal{display:flex;flex-direction:column;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.portal:hover{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent),var(--shadow)}
.portal .ic{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--navy);color:#fff}
.portal .ic .lu{width:26px;height:26px}
.portal h2{font-size:21px;margin:14px 0 4px}
.portal p{color:var(--muted);font-size:14.5px;line-height:1.85;flex:1}
.portal .go{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:11px;padding:9px 18px}
.portal .meta{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.portal.off{opacity:.5;pointer-events:none}
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 0 18px;counter-reset:j}
@media (max-width:680px){.journey{grid-template-columns:1fr 1fr;row-gap:12px}}
.journey div{position:relative;text-align:center;font-size:13.5px;color:var(--muted);padding:0 6px;counter-increment:j}
.journey div::before{content:counter(j);display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:var(--card);border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:14px;position:relative;z-index:1}
.journey div::after{content:"";position:absolute;top:15px;left:-50%;width:100%;height:1.5px;background:var(--line)}
.journey div:last-child::after{display:none}
@media (max-width:680px){.journey div::after{display:none}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:680px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:26px;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.tl{position:relative;padding-right:22px}
.tl:before{content:"";position:absolute;right:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .it{position:relative;margin-bottom:14px}
.tl .it:before{content:"";position:absolute;right:-20px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--accent)}
.tl .it small{color:var(--accent);font-weight:700}
.prizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.prize{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.prize .lu{width:26px;height:26px}
.prize .pl{font-size:17px;font-weight:700;margin-top:4px}
details.faq{border-bottom:1px solid var(--line);padding:12px 2px}
details.faq:last-child{border-bottom:0}
details.faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .lu{color:var(--muted);transition:transform .2s}
details.faq[open] summary .lu{transform:rotate(180deg)}
details.faq p{margin-top:8px;color:var(--muted);line-height:1.85}
.partners{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center}
.partners img{max-height:48px;max-width:150px}
.partners span{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}
footer a{color:var(--muted)}
.team-login{text-align:center;margin:-6px 0 16px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar">
  <div class="in">
    <div class="org"><span data-logo hidden></span><span data-text="brand.orgName"></span></div>
    <h1 id="title"></h1>
    <div class="ev"><span data-text="brand.boothName"></span></div>
    <p class="about" data-text="program.about"></p>
  </div>
</header>
<div class="wrap">
  <div class="portals">
    <a class="portal" id="pInv" href="index.html">
      <span class="ic"><i data-icon="briefcase-business"></i></span>
      <h2 data-text="investor.title"></h2>
      <p id="pInvText"></p>
      <span class="go">ابدأ الآن <i data-icon="arrow-left"></i></span>
      <div class="meta" id="pInvMeta"></div>
    </a>
    <a class="portal" id="pHack" href="hackathon.html">
      <span class="ic"><i data-icon="zap"></i></span>
      <h2 data-text="hackathon.name"></h2>
      <p id="pHackText"></p>
      <span class="go"><span id="pHackGo">سجّل فريقك</span> <i data-icon="arrow-left"></i></span>
      <div class="meta" id="pHackMeta"></div>
    </a>
  </div>
  <p class="team-login" id="teamLogin"></p>
  <div class="journey" id="journey"></div>

  <div class="kpis" id="kpis"></div>

  <div class="card hidden" id="schedCard"><h2><i data-icon="calendar"></i> الجدول</h2><div class="tl" id="sched"></div></div>
  <div class="card hidden" id="prizeCard"><h2><i data-icon="trophy"></i> الجوائز</h2><div class="prizes" id="prizes"></div></div>
  <div class="card hidden" id="faqCard"><h2><i data-icon="circle-help"></i> الأسئلة الشائعة</h2><div id="faq"></div></div>
  <div class="card hidden" id="partCard"><h2 style="justify-content:center">الشركاء</h2><div class="partners" id="partners"></div></div>

  <footer><span data-text="brand.orgName"></span> · <a href="privacy.html">سياسة الخصوصية</a></footer>
</div>
<script>
const $ = id => document.getElementById(id), esc = APP.esc, fmt = APP.fmt;
APP.ready.then(async c => {
  document.title = c.brand.eventName || "مرحبًا";
  $("title").textContent = c.brand.eventName || c.brand.orgName;
  const H = c.hackathon, I = c.investor;
  const gate = c.modules.investor && c.modules.hackathon && H.registration === "ticket";
  $("pInvText").textContent = I.tagline;
  $("pHackText").textContent = gate ? `للمتأهلين من ${I.title}: سجّل فريقك وقدّم مشروعك وعرضك الاستثماري، واحصل على تقييم فوري، ونافس على الجوائز.` : H.tagline;
  if (!c.modules.investor) $("pInv").classList.add("off");
  if (!c.modules.hackathon) $("pHack").classList.add("off");
  if (gate) $("pHackGo").textContent = "لديّ رمز تأهل";
  $("journey").innerHTML = gate ? `<div>اعرض فكرتك على ${esc(I.title)}</div><div>احصل على ${I.qualifyScore} درجة أو أكثر لتتأهل</div><div>سجّل فريقك وقدّم مشروعك</div><div>التحكيم وإعلان الفائزين</div>` : "";
  try { if (localStorage.getItem("hack_code")) $("teamLogin").innerHTML = `مسجّل في الهاكاثون؟ <a href="hackathon.html">ادخل صفحة فريقك</a>`; } catch(e){}
  // الجدول والجوائز والأسئلة والشركاء
  const P = c.program;
  if (P.schedule.length) { $("schedCard").classList.remove("hidden"); $("sched").innerHTML = P.schedule.map(x=>`<div class="it"><small>${esc(x.day)}</small><div><b>${esc(x.title)}</b></div>${x.desc?`<div class="muted small">${esc(x.desc)}</div>`:""}</div>`).join(""); }
  if (P.prizes.length) { $("prizeCard").classList.remove("hidden"); $("prizes").innerHTML = P.prizes.map((x,i)=>`<div class="prize"><i data-icon="award" class="medal-${i+1}"></i><div class="pl">${esc(x.place)}</div><b>${esc(x.title)}</b>${x.desc?`<div class="muted small">${esc(x.desc)}</div>`:""}</div>`).join(""); }
  if (P.faq.length) { $("faqCard").classList.remove("hidden"); $("faq").innerHTML = P.faq.map(x=>`<details class="faq"><summary>${esc(x.q)}<i data-icon="chevron-down"></i></summary><p>${esc(x.a)}</p></details>`).join(""); }
  if (P.partners.length) { $("partCard").classList.remove("hidden"); $("partners").innerHTML = P.partners.map(x=>x.logoUrl?`<img src="${esc(x.logoUrl)}" alt="${esc(x.name)}" title="${esc(x.name)}">`:`<span>${esc(x.name)}</span>`).join(""); }
  // عدّاد ومرحلة الهاكاثون
  const tick = () => {
    const t = H.phase==="soon" ? H.opensAtMs : H.phase==="open" ? H.closesAtMs : null;
    let txt = {open:'<span class="dot ok"></span> التقديم مفتوح', soon:'<span class="dot wait"></span> يبدأ قريبًا', closed:'<span class="dot no"></span> انتهى التقديم'}[H.phase];
    if (t) { const ms = Math.max(0, t-Date.now()), d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60; txt += ` · ${H.phase==="soon"?"يبدأ":"يُقفل"} بعد ${d?d+" يوم ":""}${h} س ${m} د`; }
    $("pHackMeta").innerHTML = txt;
  };
  tick(); setInterval(tick, 30000);
  // أرقام حية
  const load = async () => {
    try {
      const d = await (await fetch("api/feed?scope=dashboard",{cache:"no-store"})).json();
      const k = d.kpi;
      $("pInvMeta").textContent = `${fmt(k.pitches)} فكرة عُرضت · ${fmt(k.qualified)} تأهلت`;
      $("kpis").innerHTML = [[k.pitches,"فكرة عُرضت"],[k.qualified,"متأهل"],[k.teams,"فريق منافس"],[k.submissions,"مشروع مقدَّم"]].map(([v,l])=>`<div class="kpi"><b>${fmt(v)}</b><span>${l}</span></div>`).join("");
    } catch(e){}
  };
  load(); setInterval(load, 30000);
});
</script>
</body>
</html>
