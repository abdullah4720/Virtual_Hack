<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
body{padding-bottom:90px}
.shell{display:grid;grid-template-columns:230px 1fr;gap:20px;max-width:1180px;margin:0 auto;padding:20px 16px}
@media (max-width:860px){.shell{grid-template-columns:1fr}}
nav{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
nav .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:12px;padding:0 6px}
nav .brand .ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff}
@media (max-width:860px){nav .brand{display:none}}
nav button{display:flex;align-items:center;gap:9px;font:inherit;text-align:right;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
nav button .lu{opacity:.8}
nav button:hover{color:var(--text);background:var(--card)}
nav button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:inset -3px 0 0 var(--accent),var(--shadow)}
nav button.on .lu{color:var(--accent);opacity:1}
section.pane{display:none}
section.pane.on{display:block}
.pane>h1{font-size:24px;margin-bottom:4px}
.pane>p.lead{color:var(--muted);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.status{display:grid;gap:8px}
.status div{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:10px;padding:9px 12px;font-size:14.5px}
.links{display:grid;gap:8px}
.links div{display:grid;grid-template-columns:150px 1fr auto auto;gap:8px;align-items:center;background:var(--card2);border-radius:10px;padding:8px 12px;font-size:14px}
.links code{direction:ltr;text-align:left;color:var(--blue);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.links div{grid-template-columns:1fr auto auto}.links code{display:none}}
.item{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.item .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.item .head b{font-size:15.5px}
.tools{display:flex;gap:4px}
.ib{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:4px 9px;cursor:pointer}
.ib.del{color:var(--bad)}
.ib:disabled{opacity:.35;cursor:default}
.add{font:inherit;width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--accent);border-radius:12px;padding:10px;cursor:pointer;font-weight:700}
.sub{margin:10px 18px 0 0;padding-right:12px;border-right:2px solid var(--line)}
.sub .item{background:var(--card)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.sum{font-weight:700;padding:4px 12px;border-radius:999px}
.sum.ok{background:rgba(52,211,153,.14);color:var(--good)}
.sum.no{background:rgba(248,113,113,.14);color:var(--bad)}
.row-inline{display:grid;grid-template-columns:240px 1fr;gap:10px}
@media (max-width:640px){.row-inline{grid-template-columns:1fr}}
.rub{display:grid;grid-template-columns:1.2fr 90px 2fr auto;gap:8px;align-items:end}
@media (max-width:640px){.rub{grid-template-columns:1fr 80px}.rub .g{grid-column:1/-1}}
input[type=color]{height:44px;padding:4px}
input[type=range]{accent-color:var(--accent);padding:0}
.savebar{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 92%,transparent);box-shadow:0 -6px 20px -12px rgba(11,37,64,.25);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:5}
.savebar .msg{font-size:14px;color:var(--muted);flex:1;max-width:700px}
.savebar .msg.err{color:var(--bad)}
.savebar .msg.ok{color:var(--good)}
.savebar .btn{width:auto;padding:11px 28px}
.danger{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.red{background:var(--bad);color:#fff}
.logo-prev{max-height:56px;max-width:200px;background:var(--navy);border-radius:8px;padding:6px;margin-top:8px}
.login{max-width:420px;margin:14vh auto}
.help{font-size:12.5px;color:var(--muted);margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{color:var(--muted);font-weight:500;text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ntpl .head{flex-wrap:wrap}
.ntpl .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.ntpl.off{opacity:.6}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.vars code{direction:ltr;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px;color:var(--blue);cursor:pointer}
.pv{margin-top:10px}
.pv .subj{font-size:13.5px;margin-bottom:6px}
.pv iframe{width:100%;height:460px;border:1px solid var(--line);border-radius:12px;background:#f4f5f9}
.pill.warn{background:var(--gold-soft);color:var(--gold)}
</style>
</head>
<body data-noannounce>
<div id="loginView" class="wrap hidden"><div class="card login">
  <h1 style="font-size:24px">لوحة التحكم</h1>
  <p class="muted">إدارة إعدادات البرنامج وأنشطته</p>
  <label for="ak">مفتاح الإدارة</label>
  <input id="ak" type="password" dir="ltr" autocomplete="current-password">
  <button class="btn" id="loginBtn" style="margin-top:14px">دخول</button>
  <p class="err" id="loginErr"></p>
</div></div>

<div id="app" class="shell hidden">
  <nav id="nav">
    <div class="brand"><span class="ic"><i data-icon="settings"></i></span> لوحة التحكم</div>
    <button data-p="overview" class="on"><i data-icon="layout-dashboard"></i>نظرة عامة</button>
    <button data-p="brand"><i data-icon="palette"></i>الهوية والعامة</button>
    <button data-p="investor"><i data-icon="briefcase-business"></i>المستثمر الذكي</button>
    <button data-p="hack"><i data-icon="zap"></i>الهاكاثون: الإعدادات</button>
    <button data-p="tracks"><i data-icon="layers"></i>المسارات والتحديات</button>
    <button data-p="rubric"><i data-icon="list-checks"></i>معايير التقييم</button>
    <button data-p="tickets"><i data-icon="ticket"></i>التأهيل والدعوات</button>
    <button data-p="participants"><i data-icon="users"></i>المشاركون</button>
    <button data-p="judges"><i data-icon="scale"></i>المحكّمون</button>
    <button data-p="announce"><i data-icon="megaphone"></i>الإعلانات</button>
    <button data-p="notify"><i data-icon="mail"></i>الإشعارات والبريد</button>
    <button data-p="screens"><i data-icon="monitor"></i>الشاشات</button>
    <button data-p="welcome"><i data-icon="house"></i>صفحة الترحيب</button>
    <button data-p="privacy"><i data-icon="shield-check"></i>الخصوصية والحماية</button>
    <button data-p="reports"><i data-icon="chart-column"></i>التقارير والشهادات</button>
    <button data-p="data"><i data-icon="database"></i>البيانات</button>
  </nav>
  <main id="main"></main>
</div>

<div class="savebar hidden" id="savebar">
  <span class="msg" id="saveMsg">لا توجد تغييرات</span>
  <button class="btn ghost" id="discardBtn" style="width:auto;padding:11px 18px">تراجع</button>
  <button class="btn" id="saveBtn">حفظ التغييرات</button>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
// رابط كامل لصفحة؛ بدون .html عند النشر على Vercel
const abs = p => { const u = new URL(p, location.href); if (location.protocol.startsWith("http") && !APP.demo) u.pathname = u.pathname.replace(/index\.html$/,"").replace(/\.html$/,""); return u.href; };
const attr = s => esc(s).replace(/"/g,"&quot;");
let KEY; try { KEY = sessionStorage.getItem("ak"); } catch(e){}
let D = null, S = null, saved = "", pane = "overview";

async function api(action, body, extra=""){
  const r = await fetch(`api/admin?action=${action}${extra}`, {method: body?"POST":"GET", headers:{"Content-Type":"application/json","x-admin-key":KEY}, body: body?JSON.stringify(body):undefined});
  const d = await r.json().catch(()=>({error:"تعذر الاتصال"}));
  if (!r.ok) { const e = new Error(d.error || (d.errors||[]).join("، ") || "خطأ"); e.data = d; throw e; }
  return d;
}
async function load(){
  D = await api("get");
  S = JSON.parse(JSON.stringify(D.settings)); saved = JSON.stringify(S);
  $("loginView").classList.add("hidden"); $("app").classList.remove("hidden"); $("savebar").classList.remove("hidden");
  render(); dirty();
}
$("loginBtn").onclick = async () => { KEY = $("ak").value.trim(); try { await load(); try{sessionStorage.setItem("ak",KEY)}catch(e){} } catch(e){ $("loginErr").textContent = e.message; } };
$("ak").onkeydown = e => { if (e.key==="Enter") $("loginBtn").click(); };

// ---------- مسارات القيم ----------
const getP = (o,p) => p.split(".").reduce((a,k)=>a?.[k], o);
function setP(o,p,v){ const ks=p.split("."); const last=ks.pop(); const t=ks.reduce((a,k)=>a[k], o); t[last]=v; }
const uid = p => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2,4);

// ---------- عناصر النموذج ----------
function f(label, k, o={}){
  const v = getP(S,k);
  const t = o.type || "text";
  let inp;
  if (t==="textarea") inp = `<textarea data-k="${k}" rows="${o.rows||3}" maxlength="${o.max||2000}" placeholder="${attr(o.ph||"")}">${esc(v)}</textarea>`;
  else if (t==="lines") inp = `<textarea data-k="${k}" data-type="lines" rows="${o.rows||6}" placeholder="${attr(o.ph||"")}">${esc((v||[]).join("\n"))}</textarea>`;
  else if (t==="num") inp = `<input data-k="${k}" data-type="num" type="number" dir="ltr" value="${v??""}" min="${o.min??""}" max="${o.max??""}" step="${o.step||1}">`;
  else if (t==="select") inp = `<select data-k="${k}">${o.opts.map(([val,l])=>`<option value="${val}" ${val===v?"selected":""}>${l}</option>`).join("")}</select>`;
  else inp = `<input data-k="${k}" type="${t}" value="${attr(v)}" ${o.ltr?'dir="ltr"':""} maxlength="${o.max||200}" placeholder="${attr(o.ph||"")}">`;
  return `<div>${label?`<label>${label}</label>`:""}${inp}${o.help?`<div class="help">${o.help}</div>`:""}</div>`;
}
// منتقي أيقونة Lucide (للمسارات والمستشارين)
const iconField = (label, k) => { const v = getP(S,k) || ""; const names = Object.keys(window.ICONS||{}); return `<div>${label?`<label>${label}</label>`:""}<div style="display:flex;gap:8px;align-items:center"><span style="display:grid;place-items:center;width:44px;height:44px;border-radius:11px;background:var(--soft);color:var(--accent);flex:none;font-size:20px" data-prev="${k}">${glyph(v)}</span><select data-k="${k}" data-icon-field>${names.includes(v)?"":`<option value="${attr(v)}" selected>${esc(v)||"—"}</option>`}${names.map(n=>`<option value="${n}" ${n===v?"selected":""}>${n}</option>`).join("")}</select></div></div>`; };
const tog = (label, k, help="") => `<label class="toggle"><span><b>${label}</b>${help?`<div class="help">${help}</div>`:""}</span><input type="checkbox" data-k="${k}" data-type="bool" ${getP(S,k)?"checked":""}></label>`;
const tools = (list, i, n) => `<div class="tools"><button class="ib" data-act="up" data-list="${list}" data-i="${i}" ${i===0?"disabled":""} title="أعلى">↑</button><button class="ib" data-act="down" data-list="${list}" data-i="${i}" ${i===n-1?"disabled":""} title="أسفل">↓</button><button class="ib del" data-act="del" data-list="${list}" data-i="${i}">حذف</button></div>`;
const addBtn = (list, label) => `<button class="add" data-act="add" data-list="${list}">+ ${label}</button>`;
const card = (title, body, cls="") => `<div class="card ${cls}">${title?`<h2>${title}</h2>`:""}${body}</div>`;

const NEW = {
  "investor.investors": () => ({id:uid("inv"), name:"", title:"", emoji:"briefcase-business", desc:"", persona:"", style:""}),
  "hackathon.tracks": () => ({id:uid("t"), icon:"lightbulb", title:"", desc:"", challenges:[]}),
  "challenges": () => ({id:uid("c"), title:"", desc:""}),
  "hackathon.rubric": () => ({key:uid("k"), label:"", max:10, guide:""}),
  "hackathon.judges": () => ({id:uid("j"), name:"", email:"", key:genKey(), tracks:[]}),
  "program.schedule": () => ({day:"", title:"", desc:""}),
  "program.prizes": () => ({place:"", title:"", desc:""}),
  "program.faq": () => ({q:"", a:""}),
  "program.partners": () => ({name:"", logoUrl:""}),
};
function genKey(n=10){ const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; return Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>a[x%a.length]).join(""); }
let TEAMS = null, CERTS = null, LOGS = null; const OPEN = new Set();
const when = d => new Date(d).toLocaleString("ar-SA-u-nu-latn",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});

// ---------- الأقسام ----------
const fmt = n => Number(n||0).toLocaleString("ar-SA-u-nu-latn");
const P = {
  overview(){
    const st = D.stats, sy = D.system, base = "";
    const ok = (b, y, n) => `<span class="pill ${b?"ok":"no"}">${b?y:n}</span>`;
    const ph = {open:'<span class="dot ok"></span> مفتوح', soon:'<span class="dot wait"></span> لم يبدأ', closed:'<span class="dot no"></span> مُقفل'}[sy.phase];
    const links = [
      ["صفحة الترحيب (رمز QR الموحد)","welcome.html"],["المستثمر الذكي (الزوار)","index.html"],["الهاكاثون (الفرق)","hackathon.html"],["شاشة الجناح (المتحكَّم بها)","booth.html"],
      ["لوحة البيانات","dashboard.html"],["لوحة اللجنة","judges.html"],["إعلان الفائزين","winners.html"],["التقرير الختامي","report.html"],["سياسة الخصوصية","privacy.html"]];
    return `<h1>نظرة عامة</h1><p class="lead">${esc(S.brand.orgName)} · ${esc(S.brand.eventName)}</p>
      <div class="stats">
        <div class="stat"><b>${fmt(st.pitches)}</b><span>عرض على المستثمر الذكي</span></div>
        <div class="stat"><b>${fmt(st.qualified)}</b><span>متأهل للهاكاثون</span></div>
        <div class="stat"><b>${fmt(st.ticketsUsed)}</b><span>رمز تأهل استُخدم للتسجيل</span></div>
        <div class="stat"><b>${fmt(st.teams)}</b><span>فريق في الهاكاثون</span></div>
        <div class="stat"><b>${fmt(st.submissions)}</b><span>تقديم مُقيَّم</span></div>
        <div class="stat"><b>${fmt(st.fromInvestor)}</b><span>فريق جاء من المستثمر الذكي</span></div>
        <div class="stat"><b>${st.judged}/${st.finalists}</b><span>متأهل قيّمته اللجنة</span></div>
      </div>
      <div class="grid2">
        ${card("حالة النظام", `<div class="status">
          <div><span>قاعدة البيانات</span>${ok(sy.database,"متصلة (Supabase)","ذاكرة مؤقتة: للتجربة فقط")}</div>
          <div><span>الذكاء الاصطناعي</span>${ok(sy.ai, {server:"مفعّل على الخادم", "claude-account":"مفعّل عبر حسابك في Claude", "browser-key":"مفعّل بمفتاح على هذا الجهاز"}[sy.aiMode] || "مفعّل", "غير مفعّل: التقييمات وهمية")}</div>
          <div><span>مفتاح اللجنة</span>${ok(sy.judgeKeySet,"مضبوط","غير مضبوط")}</div>
          <div><span>التقديم في الهاكاثون</span><span class="pill">${ph}</span></div>
          <div><span>إرسال البريد</span>${ok(sy.mail,"مفعّل","غير مفعّل (RESEND_API_KEY)")}</div>
          <div><span>استهلاك الذكاء الاصطناعي اليوم</span><span class="pill ${sy.usageToday > sy.dailyAiCalls*0.8 ? "no" : ""}">${fmt(sy.usageToday)} / ${fmt(sy.dailyAiCalls)}</span></div>
          <div><span>اختبار الذكاء الاصطناعي</span><button class="ib" data-act="aitest"><i data-icon="flask-conical"></i> اختبر الآن</button></div><div id="aiTest" class="help" style="display:block;background:none;padding:0"></div>
          ${st.pendingEvals ? `<div><span>تقييمات معلّقة</span><button class="ib" data-act="reeval"><i data-icon="hourglass"></i> ${st.pendingEvals} · أكمل التقييم الآن</button></div>` : ""}</div>`)}
        ${APP.demo ? card("تفعيل الذكاء الاصطناعي في النسخة التجريبية", sy.aiMode === "claude-account"
          ? `<p class="muted">الذكاء الاصطناعي يعمل الآن عبر حسابك في Claude. التقييمات حقيقية.</p>`
          : `<p class="muted small">بدون ذكاء اصطناعي تكون الأسئلة ثابتة والدرجات <b style="color:var(--bad)">عشوائية وهمية</b>. للتقييم الحقيقي على هذا الجهاز أدخل مفتاح Claude API (من console.anthropic.com). يُحفظ في هذا المتصفح فقط، ولا يُرسل إلا إلى Anthropic.</p>
            <div class="grid2" style="margin-top:10px"><input id="demoKey" type="password" dir="ltr" placeholder="sk-ant-..." value=""><div style="display:flex;gap:8px"><button class="btn" data-act="savekey" style="width:auto;padding:10px 18px">تفعيل</button>${sy.aiMode==="browser-key"?`<button class="btn ghost" data-act="clearkey" style="width:auto;padding:10px 18px">إزالة المفتاح</button>`:""}</div></div>
            <p class="help">عند النشر الفعلي يوضع المفتاح في إعدادات الخادم (ANTHROPIC_API_KEY)، ولا حاجة لهذا الحقل.</p>`, sy.ai ? "" : "danger") : ""}
        ${card("الأنشطة", tog("المستثمر الذكي","modules.investor","لعبة سريعة لزوار المعرض") + tog("الهاكاثون الافتراضي","modules.hackathon","منافسة أونلاين خلال أيام الفعالية"))}
      </div>
      ${card("روابط المنصة", `<div class="links">${links.map(([l,p])=>`<div><span>${l}</span><code>${esc(abs(p))}</code><a class="ib" href="${p}" target="_blank">فتح</a><button class="ib" data-copy="${attr(abs(p))}">نسخ</button></div>`).join("")}</div>`)}`;
  },
  brand(){
    return `<h1>الهوية والعامة</h1><p class="lead">تظهر هذه البيانات في كل صفحات المنصة والشاشات.</p>
      ${card("بيانات الجهة", `<div class="grid2">${f("اسم الجهة","brand.orgName",{ph:"مثال: جامعة القصيم"})}${f("اسم الفعالية","brand.eventName",{ph:"مثال: ملتقى ريادة الأعمال"})}</div>
        <div class="grid2">${f("اسم الجناح أو الموقع","brand.boothName",{ph:"مثال: جناح جامعة القصيم"})}${f("المنطقة الزمنية","brand.tzOffset",{type:"select",opts:[["+03:00","السعودية (UTC+3)"],["+04:00","الإمارات وعُمان (UTC+4)"],["+02:00","مصر (UTC+2)"],["+01:00","UTC+1"],["+00:00","UTC"]]})}</div>
        ${f("رابط الشعار (اختياري)","brand.logoUrl",{ltr:true,max:500,ph:"https://…/logo.png",help:"رابط صورة PNG أو SVG بخلفية شفافة. يظهر أعلى الصفحات والشاشات."})}
        ${S.brand.logoUrl?`<img class="logo-prev" src="${attr(S.brand.logoUrl)}" alt="">`:""}`)}

        <div class="grid2">${f("الجمهور","_aAud",{type:"select",opts:Object.entries(AUD)})}<label class="toggle" style="margin-top:28px"><span><b>إرسال بالبريد أيضًا</b><div class="help">${D.system.mail?"للفرق أو المحكّمين حسب الجمهور":"الإرسال غير مفعّل"}</div></span><input type="checkbox" data-k="_aEmail" data-type="bool" ${tmp._aEmail?"checked":""} ${D.system.mail?"":"disabled"}></label></div>
        <button class="btn" data-act="announce" style="margin-top:10px"><i data-icon="megaphone"></i> نشر الإعلان</button>`)}
      ${card(`الإعلانات (${A.length})`, A.length ? A.map(a=>`<div class="item" style="${a.active?"":"opacity:.5"}"><div class="head"><b>${esc(a.title)}</b><div class="tools"><button class="ib" data-act="atoggle" data-id="${a.id}" data-on="${a.active?0:1}">${a.active?"إيقاف":"تفعيل"}</button><button class="ib del" data-act="adelete" data-id="${a.id}">حذف</button></div></div>
        ${a.body?`<div class="help" style="white-space:pre-wrap">${esc(a.body)}</div>`:""}<div class="help">${a.audience.startsWith("team:")?`رسالة خاصة لفريق «${esc(a.teamName)}»`:AUD[a.audience]} · ${when(a.created_at)}</div></div>`).join("") : `<p class="muted">لا توجد إعلانات.</p>`)}`;
  },
  notify(){
    const K = D.notifyKinds || {}, N = S.notify, mail = D.system.mail;
    const ST = {sent:["ok","أُرسلت"], failed:["no","فشلت"], skipped:["","لم تُرسل: البريد غير مفعّل"], sending:["warn","قيد الإرسال"]};
    const tot = LOGS?.totals;
    const groups = [["الزوار والمستثمر الذكي",["otp","qualified","notQualified","invite"]],["الفرق في الهاكاثون",["registered","evaluated","reminderNoSubmit","reminderClose","finalists","winner","results","message"]],["المحكّمون",["judgeInvite","judgeReminder"]],["عامة",["announcement"]]];
    const tpl = k => { const m = K[k], t = N.templates[k]; if (!m || !t) return "";
      const open = OPEN.has(k), base = "notify.templates."+k+".";
      return `<div class="item ntpl ${t.on||m.locked?"":"off"}"><div class="head"><div><b>${esc(m.label)}</b><div class="meta"><i data-icon="send"></i> ${esc(m.to)} · <i data-icon="clock"></i> ${esc(m.when)}</div></div>
        <div class="tools" style="align-items:center;gap:8px">${m.custom?"":`<button class="ib" data-act="nopen" data-k="${k}">${open?"إغلاق":'<i data-icon="pencil"></i> النص'}</button>`}<button class="ib" data-act="npreview" data-k="${k}"><i data-icon="eye"></i> معاينة</button>
          <label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:13px">${m.locked?"دائمًا":"مفعّلة"}<input type="checkbox" data-k="${base}on" data-type="bool" ${t.on||m.locked?"checked":""} ${m.locked?"disabled":""} style="width:20px;height:20px;accent-color:var(--accent)"></label></div></div>
        ${open && !m.custom ? `${f("عنوان البريد (الموضوع)",base+"subject",{max:200})}${f("العنوان داخل الرسالة",base+"title",{max:200})}${f("النص",base+"body",{type:"textarea",rows:5,max:3000,help:"سطر فارغ يفصل الفقرات. الرموز والشهادات والزر تُضاف تلقائيًا."})}
          <div class="grid2">${f("نص الزر (فارغ = بلا زر)",base+"cta",{max:60})}<div></div></div>
          <div class="help">المتغيرات المتاحة (اضغط للنسخ):</div><div class="vars">${[...m.vars, ...(D.notifyCommon||[])].map(v=>`<code data-copy="{${v}}">{${v}}</code>`).join("")}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ib" data-act="ntest" data-k="${k}"><i data-icon="send"></i> إرسال تجريبي</button><button class="ib" data-act="nreset" data-k="${k}">↺ النص الافتراضي</button></div>` : ""}
        <div class="pv" id="pv-${k}"></div></div>`; };
    return `<h1>الإشعارات والبريد</h1><p class="lead">كل رسالة تُرسلها المنصة: متى، ولمن، وبأي نص. عدّل النص واحفظ، أو أوقف أي رسالة. الصفحات تبقى تعرض كل شيء للمشارك حتى لو أوقفت البريد.</p>
      ${mail ? "" : card("إرسال البريد غير مفعّل", `<p class="muted small">لن تصل أي رسالة حتى تضيف <code dir="ltr">RESEND_API_KEY</code> و<code dir="ltr">MAIL_FROM</code> في إعدادات الخادم (Vercel)، مع توثيق نطاق البريد في Resend. يمكنك الآن تجهيز النصوص ومعاينتها، والسجل يبيّن ما كان سيُرسل.</p>`, "danger")}
      ${tot ? `<div class="stats"><div class="stat"><b>${fmt(tot.sent)}</b><span>رسالة أُرسلت</span></div><div class="stat"><b style="color:${tot.failed?"var(--bad)":""}">${fmt(tot.failed)}</b><span>فشلت</span></div><div class="stat"><b>${fmt(tot.skipped)}</b><span>لم تُرسل (البريد غير مفعّل)</span></div></div>` : ""}
      ${card("الإعدادات العامة", tog("إرسال رسائل الفريق لكل الأعضاء","notify.members","القائد وكل عضو أضاف بريده عند التسجيل. عند الإيقاف: القائد فقط.")
        + `<div class="grid2">${tog("تذكير قبل إقفال التقديم","notify.reminders.closeOn","لكل الفرق النشطة، مرة واحدة")}${f("قبل الإقفال بـ (ساعة)","notify.reminders.closeHours",{type:"num",min:1,max:168})}</div>
        <div class="grid2">${tog("تذكير من سجّل ولم يقدّم","notify.reminders.noSubmitOn","مرة واحدة لكل فريق")}${f("بعد التسجيل بـ (ساعة)","notify.reminders.noSubmitHours",{type:"num",min:1,max:168})}</div>
        <p class="help">التذكيرات تُرسل تلقائيًا أثناء عمل المنصة (تُفحص كل 10 دقائق عند فتح أي صفحة أو شاشة)، ومرة يوميًا من الخادم احتياطًا. لا تتكرر الرسالة نفسها للفريق نفسه.</p>`)}
      ${card("إرسال الآن", `<div class="grid3">
          <button class="btn ghost" data-act="nreminders" ${mail?"":"disabled"}><i data-icon="alarm-clock"></i> شغّل التذكيرات الآن</button>
          <button class="btn ghost" data-act="sendresults"><i data-icon="trophy"></i> أرسل النتائج والشهادات</button>
          <button class="btn ghost" data-act="remindjudges"><i data-icon="scale"></i> ذكّر المحكّمين بما بقي</button></div>
        <p class="help" id="nMsg">«النتائج والشهادات» تتطلب تفعيل «نشر النتائج» في قسم التقارير: الفائزون الثلاثة يتلقون رسالة الفوز، والبقية رسالة الشكر، ومع كل منها روابط شهادات الأعضاء. كل فريق يتلقاها مرة واحدة.</p>`)}
      ${card("نصوص الرسائل", f("بريد الرسائل التجريبية","_testTo",{ltr:true,max:100,ph:"you@example.com",help:"تصلك عليه الرسالة التجريبية ببيانات وهمية، بالنص الحالي قبل الحفظ."})
        + groups.map(([g, ks])=>`<h3 style="margin:16px 0 8px;font-size:16px;color:var(--muted)">${g}</h3>${ks.map(tpl).join("")}`).join(""))}
      ${card(`<span style="display:flex;justify-content:space-between;align-items:center">سجل البريد <button class="ib" data-act="nlog">↻ تحديث</button></span>`, !LOGS ? `<p class="muted">جارٍ التحميل…</p>` : LOGS.log.length ? `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>الوقت</th><th>الرسالة</th><th>إلى</th><th>الموضوع</th><th>الحالة</th></tr></thead><tbody>
        ${LOGS.log.map(x=>`<tr><td>${when(x.created_at)}</td><td>${esc(K[x.kind]?.label||x.kind)}</td><td dir="ltr" style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(x.recipients)}</td><td style="max-width:280px;overflow:hidden;text-overflow:ellipsis">${esc(x.subject)}</td><td><span class="pill ${(ST[x.status]||[""])[0]}" title="${attr(x.error||"")}">${(ST[x.status]||["",x.status])[1]}</span></td></tr>`).join("")}
        </tbody></table></div>` : `<p class="muted">لم تُرسل رسائل بعد.</p>`)}`;
  },
  screens(){

      ${card("شاشات التناوب", tog("شاشة المستثمر الذكي","booth.screens.investor") + tog("شاشة ترتيب الهاكاثون","booth.screens.hackathon") + tog("لوحة البيانات","booth.screens.dashboard") + f("مدة كل شاشة (ثانية)","booth.rotateSeconds",{type:"num",min:8,max:300}))}

          <div class="grid2" style="margin-top:10px">${f("إعادة الضبط بعد عدم الاستخدام (ثانية)","booth.kioskIdle",{type:"num",min:30,max:600})}<div><label>&nbsp;</label><button class="btn ghost" data-act="kioskkey"><i data-icon="refresh-cw"></i> توليد رابط جديد (يُبطل القديم)</button></div></div>`

        <p class="help">الرابط سري: لا يُعرض للزوار. بعد إنشائه الرجاء حفظ التغييرات ثم فتحه على الجهاز اللوحي، ويُستحسن تثبيت الجهاز على وضع الشاشة الكاملة (Guided Access في iPad).</p>`)}

        <div class="grid2" style="margin-top:10px">${f("اكتب «حذف» للتأكيد","_confirm",{ph:"حذف"})}${f("ما الذي يُحذف؟","_scope",{type:"select",opts:[["investor","عروض المستثمر الذكي"],["hackathon","فرق الهاكاثون وتقديماتها ودرجات اللجنة"],["all","كل البيانات"]]})}</div>
        <button class="btn red" data-act="reset" style="margin-top:12px">حذف البيانات</button><p class="err" id="resetMsg"></p>`, "danger")}
      ${card("استعادة الإعدادات الافتراضية", `<p class="muted small">تعيد كل الإعدادات إلى القالب الأصلي (لا تحذف البيانات). تحتاج الحفظ بعدها.</p><button class="btn ghost" data-act="defaults" style="margin-top:10px">استعادة القالب</button>`)}`;
  },
};
let tmp = {_judgesBulk:"", _people:"", _testTo:"", _confirm:"", _scope:"investor", _count:5, _label:"", _q:"", _aTitle:"", _aBody:"", _aAud:"all", _aEmail:false};

function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.p===pane));
  const proxy = new Proxy(S, {get:(t,k)=> k in tmp ? tmp[k] : t[k]});
  const real = S; S = proxy; $("main").innerHTML = `<section class="pane on">${P[pane]()}</section>`; S = real;
  computed();
}
function computed(){
  const sum = S.hackathon.rubric.reduce((a,r)=>a+(Number(r.max)||0),0), el = $("rubSum");
  if (el) { el.textContent = `المجموع ${sum} / 100`; el.className = "sum " + (sum===100?"ok":"no"); }
  if ($("wAi")) { $("wAi").textContent = S.hackathon.weights.ai+"%"; $("wJ").textContent = (100-S.hackathon.weights.ai)+"%"; }
}
function dirty(msg, cls=""){
  const d = JSON.stringify(S) !== saved;
  $("saveBtn").disabled = !d; $("discardBtn").disabled = !d;
  $("saveMsg").className = "msg " + cls;
  $("saveMsg").textContent = msg || (d ? "لديك تغييرات غير محفوظة" : "كل التغييرات محفوظة");
}

$("nav").onclick = async e => {
  const b = e.target.closest("button[data-p]"); if (!b) return; pane = b.dataset.p; render(); scrollTo(0,0);
  if (pane === "participants") { TEAMS = (await api("teams")).teams; render(); }
  if (pane === "reports") CERTS = null;
  if (pane === "notify") { LOGS = await api("mail-log").catch(()=>null); render(); }
};

$("main").addEventListener("input", e => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  let v = el.value;
  if (el.dataset.type==="num") v = v===""? "" : Number(v);
  if (el.dataset.type==="bool") v = el.checked;
  if (el.dataset.type==="lines") v = v.split("\n").map(x=>x.trim()).filter(Boolean);
  if (k.startsWith("_")) { tmp[k]=v; if (k==="_q") { const pos = el.selectionStart; render(); const n=$("main").querySelector('[data-k="_q"]'); n.focus(); n.setSelectionRange(pos,pos); } return; }
  setP(S,k,v); computed(); dirty();
});
$("main").addEventListener("change", e => {
  if (e.target.dataset.k === "brand.logoUrl") render();
  if (e.target.hasAttribute("data-icon-field")) { const pv = $("main").querySelector(`[data-prev="${e.target.dataset.k}"]`); if (pv) pv.innerHTML = glyph(e.target.value); }
  if (e.target.dataset.jt != null) {
    const j = S.hackathon.judges[Number(e.target.dataset.jt)], id = e.target.value;
    j.tracks = e.target.checked ? [...new Set([...j.tracks, id])] : j.tracks.filter(x => x !== id);
    dirty();
  }
});

$("main").addEventListener("click", async e => {
  const c = e.target.closest("[data-copy]");
  if (c) { const old = c.textContent; try { await navigator.clipboard.writeText(c.dataset.copy); c.textContent="✓"; setTimeout(()=>c.textContent=old,1200);} catch(_){} return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, list = b.dataset.list, i = Number(b.dataset.i);
  if (["add","del","up","down"].includes(act)) {
    const arr = getP(S, list);
    if (act==="add") arr.push((NEW[list] || NEW[list.split(".").pop()])());
    if (act==="del") { if (!confirm("حذف هذا العنصر؟")) return; arr.splice(i,1); }
    if (act==="up" && i>0) [arr[i-1],arr[i]] = [arr[i],arr[i-1]];
    if (act==="down" && i<arr.length-1) [arr[i+1],arr[i]] = [arr[i],arr[i+1]];
    render(); dirty();
    if (act==="add") { const items = $("main").querySelectorAll(`[data-k^="${list}.${arr.length-1}."]`); items[0]?.focus(); }
    return;
  }
  if (act==="nopen") { const k=b.dataset.k; OPEN.has(k)?OPEN.delete(k):OPEN.add(k); render(); return; }
  if (act==="nreset") { const k=b.dataset.k; if (!confirm("استعادة النص الافتراضي لهذه الرسالة؟")) return; S.notify.templates[k] = {...D.defaults.notify.templates[k], on: S.notify.templates[k].on}; render(); dirty(); return; }
  if (act==="npreview" || act==="ntest") {
    const k=b.dataset.k, box=$("pv-"+k);
    if (act==="ntest" && !/^\S+@\S+\.\S+$/.test(tmp._testTo||"")) { alert("اكتب بريد الرسائل التجريبية أعلى القسم"); return; }
    if (act==="npreview" && box.innerHTML) { box.innerHTML=""; return; }
    b.disabled = true;
    try {
      const r = await api("notify-preview", {kind:k, template:S.notify.templates[k], to: act==="ntest" ? tmp._testTo : undefined});
      box.innerHTML = `<div class="subj"><span class="muted">الموضوع:</span> <b>${esc(r.subject)}</b>${act==="ntest"?` · <span class="pill ok">✓ أُرسلت إلى ${esc(tmp._testTo)}</span>`:""}</div><iframe sandbox title="معاينة"></iframe>`;
      box.querySelector("iframe").srcdoc = r.html;
      if (act==="ntest") LOGS = await api("mail-log").catch(()=>LOGS);
    } catch(err){ alert(err.message); }
    b.disabled = false; return;
  }
  if (act==="nlog") { LOGS = await api("mail-log"); render(); return; }
  if (act==="nreminders" || act==="sendresults" || act==="remindjudges") {
    if (JSON.stringify(S) !== saved) return alert("احفظ التغييرات أولًا");
    const Q = {nreminders:"تشغيل التذكيرات الآن؟ لن يتلقى أي فريق التذكير نفسه مرتين.", sendresults:"إرسال النتائج والشهادات لكل الفرق المقدِّمة؟", remindjudges:"إرسال تذكير للمحكّمين الذين لم يكملوا التقييم؟"};
    if (!confirm(Q[act])) return;
    b.disabled = true;
    try {
      const r = await api({nreminders:"run-reminders", sendresults:"send-results", remindjudges:"remind-judges"}[act], {});
      const msg = act==="nreminders" ? (r.ran ? `✓ أُرسل ${r.close} تذكير بالإقفال و${r.noSubmit} تذكير لمن لم يقدّم` : "لا توجد تذكيرات مستحقة الآن (التقديم غير مفتوح أو لم يحن الموعد)")
        : act==="sendresults" ? `✓ ${r.teams} فريق: أُرسل ${r.sent||0}${r.dup?`، وسبق الإرسال لـ ${r.dup}`:""}${r.skipped?`، ولم يُرسل ${r.skipped} (البريد غير مفعّل)`:""}${r.failed?`، وفشل ${r.failed}`:""}${r.off?" (الرسالة موقوفة)":""}`
        : `✓ ${r.judges} محكّم لم يكمل: أُرسل ${r.sent||0}${r.skipped?`، ولم يُرسل ${r.skipped} (البريد غير مفعّل)`:""}`;
      LOGS = await api("mail-log").catch(()=>LOGS);
      if (pane==="notify") { render(); $("nMsg").textContent = msg; } else alert(msg);
    } catch(err){ alert(err.message); }
    b.disabled = false; return;
  }
  if (act==="aitest") {
    b.disabled = true; b.textContent = "جارٍ الاختبار…";
    try {
      const r = await api("ai-test", {});
      $("aiTest").innerHTML = r.error ? `<span style="color:var(--bad)"><i data-icon="circle-x"></i> ${esc(r.error)}</span>` : r.results.map(x=>x.ok ? `<div style="color:var(--good)"><i data-icon="circle-check"></i> ${esc(x.label)}: <span dir="ltr">${esc(x.model)}</span> يعمل (${(x.ms/1000).toFixed(1)} ث)</div>` : `<div style="display:block;background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:8px;line-height:1.9"><b style="color:var(--bad)"><i data-icon="circle-x"></i> ${esc(x.label)}</b> <bdi dir="ltr" class="muted">${esc(x.model)}</bdi><p style="unicode-bidi:plaintext;margin:4px 0">${esc(x.error)}</p><details><summary class="help" style="cursor:pointer">التفاصيل التقنية</summary><div class="help" dir="ltr" style="text-align:left;word-break:break-word">${esc(x.raw)}</div></details></div>`).join("");
    } catch(err){ $("aiTest").textContent = err.message; }
    b.disabled = false; b.innerHTML = '<i data-icon="flask-conical"></i> اختبر الآن'; return;
  }
  if (act==="jbulk") {
    const lines = String(tmp._judgesBulk||"").split("\n").map(l=>l.trim()).filter(Boolean);
    let n = 0;
    for (const l of lines) {
      const email = (l.match(/[^\s,،<>]+@[^\s,،<>]+\.[^\s,،<>]+/)||[""])[0];
      const name = l.replace(email,"").replace(/[,،<>\-–:]+/g," ").trim();
      if (!name) continue;
      if (S.hackathon.judges.some(j => (email && j.email === email) || j.name === name)) continue;
      S.hackathon.judges.push({...NEW["hackathon.judges"](), name, email}); n++;
    }
    tmp._judgesBulk = ""; render(); dirty(n ? `أُضيف ${n} محكّم. الرجاء حفظ التغييرات.` : "لم يُضف أحد (تحقق من الأسطر أو أنهم مضافون مسبقًا)", n ? "ok" : "err"); return;
  }
  if (act==="kioskkey") { if (S.booth.kioskKey && !confirm("سيتوقف الرابط الحالي للجهاز اللوحي. متابعة؟")) return; S.booth.kioskKey = genKey(16); render(); dirty("أُنشئ رابط الجهاز اللوحي. الرجاء حفظ التغييرات.", "ok"); return; }
  if (act==="genkey") { S.hackathon.judgeKey = genKey(); render(); dirty(); return; }
  if (act==="reeval") { b.disabled = true; b.textContent = "جارٍ التقييم…"; try { const r = await api("reeval", {}); D = await api("get"); render(); dirty(`اكتمل تقييم ${r.evaluated}${r.remaining?`، وبقي ${r.remaining}`:""}`, "ok"); } catch(err){ alert(err.message); } return; }
  if (act==="tstatus") {
    const dq = b.dataset.s === "disqualified";
    if (dq && !confirm("استبعاد هذا الفريق؟ سيختفي من الترتيب ولن يستطيع التقديم.")) return;
    await api("team-status", {id: Number(b.dataset.id), status: b.dataset.s}); TEAMS = (await api("teams")).teams; render(); return;
  }
  if (act==="msg") {
    const title = prompt(`عنوان الرسالة لفريق «${b.dataset.name}»:`); if (!title) return;
    const body = prompt("نص الرسالة (اختياري):") || "";
    try { const r = await api("message", {team_id: Number(b.dataset.id), title, body}); alert(r.emailed ? "✓ أُرسلت الرسالة وظهرت في صفحة الفريق" : "✓ ظهرت الرسالة في صفحة الفريق (البريد غير مفعّل)"); D = await api("get"); } catch(err){ alert(err.message); }
    return;
  }
  if (act==="announce") {
    if (!tmp._aTitle) return alert("اكتب عنوان الإعلان");
    try { const r = await api("announce", {title: tmp._aTitle, body: tmp._aBody, audience: tmp._aAud, email: tmp._aEmail}); tmp._aTitle = ""; tmp._aBody = ""; D = await api("get"); render(); dirty(`✓ نُشر الإعلان${r.emailed?` وأُرسل إلى ${r.emailed} بريد`:""}`, "ok"); } catch(err){ alert(err.message); }
    return;
  }
  if (act==="atoggle") { await api("announce-toggle", {id: Number(b.dataset.id), active: b.dataset.on === "1"}); D = await api("get"); render(); return; }
  if (act==="adelete") { if (!confirm("حذف الإعلان؟")) return; await api("announce-delete", {id: Number(b.dataset.id)}); D = await api("get"); render(); return; }
  if (act==="jinvite") {
    if (JSON.stringify(S) !== saved) return alert("احفظ التغييرات أولًا");
    const r = await api("judge-invite", b.dataset.id ? {id: b.dataset.id} : {}); alert(`أُرسلت ${r.sent} من ${r.total} دعوة`); return;
  }
  if (act==="notify") { if (!confirm("إرسال إشعار التأهل لكل الفرق المتأهلة؟")) return; const r = await api("notify-finalists", {}); $("notifyMsg").textContent = `✓ أُشعرت الفرق المتأهلة${r.emailed?`، وأُرسل ${r.emailed} بريد`:""}`; return; }
  if (act==="loadcerts") { CERTS = (await api("certs")).certs; render(); return; }
  if (act==="defaults") { if (!confirm("استعادة كل الإعدادات الافتراضية؟")) return; S = JSON.parse(JSON.stringify(D.defaults)); S.hackathon.judgeKey = D.settings.hackathon.judgeKey; render(); dirty("تمت الاستعادة. اضغط «حفظ التغييرات» لاعتمادها."); return; }
  if (act==="export") {
    const r = await fetch(`api/admin?action=export&what=${b.dataset.what}`, {headers:{"x-admin-key":KEY}});
    const blob = await r.blob(); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = {deals:"investor-pitches.csv", scores:"judges-scores.csv"}[b.dataset.what] || "hackathon-teams.csv"; a.click(); return;
  }
  if (act==="savekey") { const k = $("demoKey").value.trim(); if (!/^sk-ant-/.test(k)) return alert("المفتاح يبدأ بـ sk-ant-"); APP.setDemoKey(k); location.reload(); return; }
  if (act==="clearkey") { APP.setDemoKey(null); location.reload(); return; }
  if (act==="invites") {
    try {
      const r = await api("invites", {count: tmp._count, label: tmp._label, people: tmp._people});
      tmp._people = ""; D = await api("get"); render();
      $("newCodes").innerHTML = `<div class="item" style="margin-top:12px"><b>رموز جديدة${r.mail?` · أُرسل ${r.mail.sent||0} بالبريد${r.mail.skipped?`، ولم يُرسل ${r.mail.skipped} (البريد غير مفعّل)`:""}${r.mail.failed?`، وفشل ${r.mail.failed}`:""}`:""}:</b><div dir="ltr" style="font-family:ui-monospace,monospace;font-size:18px;margin:8px 0;letter-spacing:2px">${r.codes.join("  ")}</div><button class="ib" data-copy="${attr(r.codes.join("\n"))}">نسخ الكل</button></div>`;
    } catch(e){ alert(e.message); }
    return;
  }
  if (act==="reset") {
    $("resetMsg").textContent="";
    try { await api("reset", {scope: tmp._scope, confirm: tmp._confirm}); tmp._confirm=""; await load(); pane="data"; render(); dirty("تم حذف البيانات", "ok"); }
    catch(err){ $("resetMsg").textContent = err.message; }
  }
});

$("saveBtn").onclick = async () => {
  $("saveBtn").disabled = true;
  try {
    const r = await api("save", {settings: S});
    S = JSON.parse(JSON.stringify(r.settings)); saved = JSON.stringify(S);
    D.settings = JSON.parse(saved); D = await api("get"); render(); dirty("✓ تم الحفظ، والتغييرات ظاهرة الآن في كل الصفحات", "ok");
  } catch(e){ dirty("لم يتم الحفظ: " + ((e.data?.errors||[]).join("، ") || e.message), "err"); $("saveBtn").disabled=false; }
};
$("discardBtn").onclick = () => { if (!confirm("التراجع عن كل التغييرات غير المحفوظة؟")) return; S = JSON.parse(saved); render(); dirty(); };
addEventListener("beforeunload", e => { if (S && JSON.stringify(S)!==saved) { e.preventDefault(); e.returnValue=""; } });

if (KEY) load().catch(()=>$("loginView").classList.remove("hidden")); else $("loginView").classList.remove("hidden");
</script>
</body>
