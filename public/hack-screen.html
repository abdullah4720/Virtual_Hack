<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة الفرق</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="qrcode.min.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
html,body{height:100%;overflow:hidden}
.grid{display:grid;grid-template-columns:1.9fr 1fr;grid-template-rows:auto 1fr;gap:1.4vw;height:100vh;padding:1.6vw}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:2vw}
header h1{font-size:3.2vw}
.sub{color:var(--muted);font-size:1.2vw}
.stats{display:flex;gap:1.1vw}
.stat{background:var(--card);border:1px solid var(--line);border-radius:1vw;padding:.7vw 1.3vw;text-align:center;min-width:9vw}
.stat b{display:block;font-size:2.1vw;color:var(--accent);line-height:1.3}
.stat small{color:var(--muted);font-size:.95vw}
.panel{background:var(--card);border:1px solid var(--line);border-radius:1.2vw;padding:1.4vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel h2{font-size:1.5vw;color:var(--muted);font-weight:500;margin-bottom:1vw}
.rows{display:flex;flex-direction:column;gap:.5vw}
.row{display:grid;grid-template-columns:3vw 1fr 14vw 5vw;gap:1vw;align-items:center;background:var(--card2);border-radius:.8vw;padding:.45vw 1vw;animation:pop .5s ease}
.rank{font-size:1.7vw;font-weight:700;text-align:center;color:var(--muted)}
.row:nth-child(1) .rank{color:#ffd166}.row:nth-child(2) .rank{color:#d7dce8}.row:nth-child(3) .rank{color:#e3a36f}
.row.fin{box-shadow:inset -.35vw 0 0 var(--accent)}
.who b{display:block;font-size:1.35vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--muted);font-size:1vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:.7vw;background:var(--line)}
.score{font-size:1.8vw;font-weight:700;color:var(--accent);text-align:left;font-variant-numeric:tabular-nums}
.side{align-items:center;text-align:center;justify-content:space-between;gap:1vw}
.side h3{font-size:1.9vw;line-height:1.5}
.qr{background:#fff;padding:.9vw;border-radius:1vw}
.qr img,.qr canvas{width:14vw!important;height:14vw!important;display:block}
.chs{display:flex;flex-direction:column;gap:.5vw;width:100%}
.chs div{background:var(--card2);border-radius:.7vw;padding:.5vw .8vw;font-size:1.1vw;text-align:right}
.cd{font-size:1.25vw;color:var(--muted)}
.cd b{color:var(--accent);font-size:1.7vw;display:block}
.legend{font-size:.95vw;color:var(--muted);margin-top:auto;padding-top:.8vw}
.empty{color:var(--muted);font-size:1.3vw;text-align:center;margin-top:3vw}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[data-logo] img{max-height:3.6vw;max-width:14vw;display:block}
.brandrow{display:flex;align-items:center;gap:1.4vw}
</style>
</head>
<body class="dark" data-screen>
<div class="grid">
  <header>
    <div class="brandrow"><div data-logo hidden></div><div><h1><i data-icon="zap"></i> <span data-title="hackathon.name"></span></h1><div class="sub" id="host"></div></div></div>
    <div class="stats">
      <div class="stat"><b id="sTeams">0</b><small>فريق مسجّل</small></div>
      <div class="stat"><b id="sSubs">0</b><small>تقديم</small></div>
      <div class="stat"><b id="sEval">0</b><small>مشروع مقيّم</small></div>
    </div>
  </header>

  <section class="panel">
    <h2><i data-icon="trophy"></i> الترتيب المباشر · تقييم الذكاء الاصطناعي</h2>
    <div class="rows" id="rows"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel side">
    <h3>شارك من جوالك<br><span class="gold">التقديم أونلاين بالكامل</span></h3>
    <div class="qr" id="qr"></div>
    <div class="cd" id="cd"></div>
    <div class="chs" id="chs"></div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; };
const url = new URLSearchParams(location.search).get("url") || (location.protocol === "file:" ? new URL("welcome.html", location.href) : new URL("welcome", location.href)).href;
try { new QRCode($("qr"), {text:url, width:400, height:400, correctLevel:QRCode.CorrectLevel.M}); } catch(e){ $("qr").textContent=url; }
let CFG, PH;
function countdown(){
  if (!CFG) return;
  const H=CFG.hackathon, p=PH||H.phase, t = p==="soon"?H.opensAtMs : p==="open"?H.closesAtMs : null;
  if (p==="closed") { $("cd").innerHTML = `<b>انتهى التقديم</b>ترقّبوا إعلان الفائزين`; return; }
  if (!t) { $("cd").innerHTML = `<b>التقديم مفتوح</b>`; return; }
  const ms = Math.max(0, t-Date.now());
  const d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60;
  $("cd").innerHTML = `${p==="soon"?"يبدأ التقديم بعد":"يُقفل التقديم بعد"}<b>${d?d+" يوم ":""}${h} س ${m} د</b>`;
}
async function refresh(){
  if (!CFG) return;
  try {
    const d = await fetch("api/hack?action=board",{cache:"no-store"}).then(r=>r.json());
    if (d.disabled) return;
    PH = d.phase; countdown();
    const H = CFG.hackathon;
    $("sTeams").textContent = d.stats.teams; $("sSubs").textContent = d.stats.submissions; $("sEval").textContent = d.stats.evaluated;
    const trackIcon = id => H.tracks.find(t=>t.id===id)?.icon || "";
    const sc = H.judging?.scope;
    $("legend").textContent = sc === "all" ? "▍ كل المشاريع المقدَّمة تدخل تحكيم اللجنة" : `▍ المميَّزون بالخط الذهبي يتأهلون لتحكيم اللجنة: ${sc === "perTrack" ? `${H.finalistsPerTrack === 2 ? "أفضل مشروعين" : `أفضل ${H.finalistsPerTrack}`} من كل مسار` : `أفضل ${H.finalists}`}`;
    $("rows").innerHTML = d.leaderboard.length ? d.leaderboard.slice(0,7).map(r=>`
      <div class="row ${r.finalist?"fin":""}"><span class="rank">${r.rank}</span>
        <div class="who"><b>${esc(r.team)}</b><small>${glyph(trackIcon(r.track))} ${esc(r.title)}</small></div>
        <div class="bar"><i style="width:${r.score}%"></i></div>
        <span class="score">${r.score}</span></div>`).join("")
      : `<p class="empty">بانتظار أول مشروع… امسح الرمز وكن الأول.</p>`;
  } catch(e){ console.warn(e); }
}
APP.ready.then(c => {
  CFG = c; document.title = c.hackathon.name;
  $("host").textContent = [c.brand.boothName, c.brand.eventName].filter(Boolean).join(" · ");
  $("chs").innerHTML = c.hackathon.tracks.map(t=>`<div>${glyph(t.icon)} ${esc(t.title)}</div>`).join("");
  refresh();
});
setInterval(refresh, 5000); setInterval(countdown, 30000);
</script>
<div data-ticker hidden></div>
<script>setInterval(()=>APP.refreshConfig(), 30000);</script>
</body>
</html>
