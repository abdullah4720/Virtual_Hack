<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شهادة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="qrcode.min.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
:root{--accent:#0f8f83;--navy:#0b2a45;--tc:#0f8f83;--gold:#b8892e}
.lu{width:1em;height:1em;vertical-align:-.15em}
*{box-sizing:border-box;margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:#e9ebf1;color:#14213a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{display:flex;gap:10px;justify-content:center;padding:12px}
.bar button{display:inline-flex;align-items:center;gap:8px;font:inherit;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:8px 18px;font-weight:700;cursor:pointer}
/* ===== الشهادة: A4 أفقي ===== */
.cert{width:297mm;height:210mm;margin:0 auto 20px;background:#fff;position:relative;display:grid;grid-template-columns:1fr 74mm;overflow:hidden;box-shadow:0 10px 40px rgba(11,42,69,.15)}
.main{position:relative;padding:17mm 18mm 14mm 16mm;display:flex;flex-direction:column}
.main:before{content:"";position:absolute;top:0;right:0;left:0;height:3.2mm;background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#fff))}
.head{display:flex;justify-content:space-between;align-items:center;gap:8mm}
.head .logos{display:flex;gap:7mm;align-items:center}
.head img{max-height:17mm;max-width:62mm;display:block}
.head .ev{font-size:12.5px;color:#5b6478;text-align:left;line-height:1.7}
.head .ev b{color:var(--navy);display:block;font-size:14px}
.eyebrow{margin-top:13mm;font-size:13px;font-weight:700;letter-spacing:.6px;color:var(--tc)}
.kind{font-size:44px;font-weight:700;color:var(--navy);line-height:1.25;margin-top:1.5mm}
.tag{display:inline-flex;align-items:center;gap:2mm;margin-top:3mm;padding:1.6mm 5mm;border-radius:99px;font-size:15px;font-weight:700;color:var(--tagink,#fff);background:var(--tc);align-self:flex-start}
.to{font-size:15px;color:#5b6478;margin-top:9mm}
.name{font-size:46px;font-weight:700;color:var(--navy);line-height:1.3;margin-top:1mm}
.rule{width:34mm;height:1.4mm;border-radius:2mm;background:var(--tc);margin-top:3mm}
.txt{font-size:17px;line-height:2.05;color:#2b3550;margin-top:6mm;max-width:178mm}
.txt b{color:var(--navy)}
.wm{position:absolute;left:12mm;bottom:10mm;font-size:62mm;line-height:1;color:var(--tc);opacity:.07;pointer-events:none}
.foot{margin-top:auto;position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:10mm;font-size:12.5px;color:#5b6478}
.foot .sig{min-width:58mm;text-align:center}
.foot .sig .ln{border-top:1px solid #c9cfdb;margin-bottom:2mm}
.foot .sig b{color:var(--navy);font-size:13.5px;display:block}
/* الشريط الجانبي */
.side{position:relative;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:17mm 9mm 14mm;text-align:center;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 9px)}
.side:before{content:"";position:absolute;inset:0 auto 0 0;width:1.6mm;background:var(--tc)}
.medal{width:30mm;height:30mm;border-radius:50%;display:grid;place-items:center;font-size:15mm;color:var(--mc,#e2b75a);border:.6mm solid color-mix(in srgb,var(--mc,#e2b75a) 60%,transparent);background:radial-gradient(circle,color-mix(in srgb,var(--mc,#e2b75a) 18%,transparent),transparent 70%)}
.side .lbl{font-size:11px;letter-spacing:.8px;color:rgba(255,255,255,.65);margin-top:4mm}
.side .yr{font-size:30px;font-weight:700;line-height:1.1;margin-top:1mm}
.side .qr{background:#fff;padding:2.2mm;border-radius:2.5mm}
.side .qr img,.side .qr canvas{width:30mm!important;height:30mm!important;display:block}
.side .code{font-size:15px;font-weight:700;letter-spacing:1.5px;margin-top:2.5mm;direction:ltr}
.side .hint{font-size:10.5px;color:rgba(255,255,255,.65);line-height:1.7;margin-top:1mm}
.side .date{font-size:13px;line-height:1.8}
.side .date small{display:block;color:rgba(255,255,255,.6);font-size:11px}
.verify{max-width:520px;margin:12vh auto;background:#fff;border-radius:16px;padding:24px;text-align:center;line-height:1.9}
@media print{ html,body{background:#fff;width:297mm;height:210mm;overflow:hidden} .bar{display:none} .cert{margin:0;box-shadow:none;break-inside:avoid;page-break-after:avoid} @page{size:A4 landscape;margin:0} }
</style>
</head>
<body data-noannounce>
<div class="bar" id="bar" style="display:none"><button onclick="print()"><i data-icon="printer"></i> طباعة / حفظ PDF</button></div>
<div id="out"><div class="verify">جارٍ التحقق من الشهادة…</div></div>
<script>
const esc = APP.esc;
const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
// صياغة محايدة تناسب المشاركين والمشاركات
const KIND = {
  participant: ["award", "شهادة مشاركة", ""],
  finalist: ["award", "شهادة تأهل", "التأهل إلى التحكيم النهائي"],
  winner1: ["trophy", "شهادة فوز", "المركز الأول"],
  winner2: ["trophy", "شهادة فوز", "المركز الثاني"],
  winner3: ["trophy", "شهادة فوز", "المركز الثالث"],
};
// الشهادة تملأ عرض الشاشة الصغيرة (الطباعة دائمًا بمقاس A4)
function fitScreen(){ const c = document.querySelector(".cert"); if (!c) return; const w = c.offsetWidth + 24; c.style.zoom = innerWidth < w ? (innerWidth / w).toFixed(3) : ""; }
addEventListener("resize", fitScreen); addEventListener("beforeprint", () => { const c = document.querySelector(".cert"); if (c) c.style.zoom = ""; }); addEventListener("afterprint", fitScreen);
APP.ready.then(async () => {
  const out = document.getElementById("out");
  if (!code) { out.innerHTML = `<div class="verify"><h2>التحقق من شهادة</h2><p>أضف رمز الشهادة إلى الرابط: certificate.html?c=الرمز</p></div>`; return; }
  const r = await fetch("api/hack?action=cert&code=" + encodeURIComponent(code), {cache: "no-store"});
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.valid) { out.innerHTML = `<div class="verify"><div style="font-size:40px;color:#c0392b"><i data-icon="circle-x"></i></div><h2>شهادة غير صالحة</h2><p>${d.error ? esc(d.error) : `لم نجد شهادة بالرمز <b dir="ltr">${esc(code)}</b>.`}</p></div>`; return; }
  const root = document.documentElement.style;
  if (d.brand.accent) root.setProperty("--accent", d.brand.accent); if (d.brand.bg) root.setProperty("--navy", d.brand.bg);
  const [ic, title, rank] = KIND[d.kind] || KIND.participant;
  const win = /^winner/.test(d.kind), trackWin = d.kind === "winner1" && d.awards === "track";
  const track = d.trackTitle || d.label || "";
  // لون الشهادة: لون المسار (مطابق للدروع والشاشات)، وإلا لون الهوية
  const tc = d.trackColor || d.brand.accent || "#0f8f83";
  root.setProperty("--tc", tc);
  // نص الوسم داكن على الألوان الفاتحة (مثل الذهبي والأخضر الليموني) ليبقى مقروءًا
  const lum = (h => { const n = parseInt(h.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; })(/^#[0-9a-f]{6}$/i.test(tc) ? tc : "#0f8f83");
  root.setProperty("--tagink", lum > 0.62 ? "#14213a" : "#fff");
  if (win) root.setProperty("--mc", "#e2b75a"); else root.setProperty("--mc", d.trackColor || "#7fd3c7");
  const tag = trackWin ? `${glyph(d.trackIcon || "trophy")} المركز الأول · مسار ${esc(track)}` : win ? `${glyph("trophy")} ${rank}` : d.kind === "finalist" ? `${glyph("award")} ${rank}` : "";
  const proj = d.project ? ` بمشروع «<b>${esc(d.project)}</b>»` : "";
  const inTrack = track && !trackWin ? ` في مسار «${esc(track)}»` : "";
  const body = trackWin ? `تقديرًا للفوز بالمركز الأول في مسار «<b>${esc(track)}</b>» في <b>${esc(d.hackathon)}</b>، ضمن فريق «<b>${esc(d.team)}</b>»${proj}.`
    : win ? `تقديرًا للفوز ب${rank} في <b>${esc(d.hackathon)}</b>، ضمن فريق «<b>${esc(d.team)}</b>»${proj}.`
    : d.kind === "finalist" ? `تقديرًا لتأهل المشروع إلى التحكيم النهائي في <b>${esc(d.hackathon)}</b>، ضمن فريق «<b>${esc(d.team)}</b>»${proj}${inTrack}.`
    : `تقديرًا للمشاركة الفاعلة في <b>${esc(d.hackathon)}</b>، ضمن فريق «<b>${esc(d.team)}</b>»${proj}${inTrack}.`;
  const dt = new Date(d.date);
  const greg = dt.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", {year: "numeric", month: "long", day: "numeric"});
  const hijri = dt.toLocaleDateString("ar-SA-u-ca-islamic-umalqura-nu-latn", {year: "numeric", month: "long", day: "numeric"});
  const logos = (d.brand.logos||[]).map(l=>`<img src="${esc(l.url)}" alt="">`).join("");
  out.innerHTML = `<div class="cert">
    <div class="main">
      <div class="head"><div class="logos">${logos}</div><div class="ev"><b>${esc(d.brand.orgName||"")}</b>${esc(d.brand.eventName||"")}</div></div>
      <div class="eyebrow">${esc(d.hackathon)}</div>
      <div class="kind">${title}</div>
      ${tag ? `<span class="tag">${tag}</span>` : ""}
      <div class="to">تُمنح هذه الشهادة إلى</div>
      <div class="name">${esc(d.name)}</div>
      <div class="rule"></div>
      <div class="txt">${body}</div>
      <div class="wm">${glyph(trackWin ? (d.trackIcon || "trophy") : ic)}</div>
      <div class="foot"><div>صدرت هذه الشهادة إلكترونيًا، ويمكن التحقق من صحتها بمسح الرمز.</div></div>
    </div>
    <div class="side">
      <div><div class="medal">${glyph(ic)}</div><div class="lbl">${esc(d.brand.eventName||"")}</div><div class="yr">${dt.getFullYear()}</div></div>
      <div><div class="qr" id="qr"></div><div class="code">${esc(d.code)}</div><div class="hint">رمز التحقق</div></div>
      <div class="date">${greg}<small>${hijri}</small></div>
    </div>
  </div>`;
  try { new QRCode(document.getElementById("qr"), {text: location.href, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M}); } catch(e){}
  document.getElementById("bar").style.display = "flex";
  document.title = `${title}${rank ? " · " + rank : ""} · ${d.name}`;
  fitScreen();
});
</script>
</body>
</html>
