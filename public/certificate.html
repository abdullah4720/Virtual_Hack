<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شهادة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="qrcode.min.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
:root{--accent:#0f8f83;--navy:#0b2a45}
.lu{width:1em;height:1em;vertical-align:-.15em}
*{box-sizing:border-box;margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:#e9ebf1;color:#1a1f36}
.bar{display:flex;gap:10px;justify-content:center;padding:12px}
.bar button{display:inline-flex;align-items:center;gap:8px;font:inherit;background:#0b2a45;color:#fff;border:0;border-radius:10px;padding:8px 18px;font-weight:700;cursor:pointer}
.cert{width:297mm;height:210mm;margin:0 auto 20px;background:#fff;position:relative;padding:16mm 22mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5mm;overflow:hidden}
.cert:before{content:"";position:absolute;inset:7mm;border:2px solid var(--navy);border-radius:6mm;pointer-events:none}
.cert:after{content:"";position:absolute;inset:10mm;border:1px solid color-mix(in srgb,var(--accent) 45%,#fff);border-radius:4mm;pointer-events:none}
.cert img.logo{max-height:20mm;max-width:60mm}
.cert .logos{display:flex;gap:12mm;align-items:center;justify-content:center}
.org{color:#5b6478;font-size:15px}
.kind{font-size:40px;font-weight:700;letter-spacing:1px}
.kind{color:var(--navy)}
.kind .gold{color:inherit}
.medal{font-size:46px;line-height:1;color:var(--accent)}
.medal-1{color:#b8892e}.medal-2{color:#8a96a3}.medal-3{color:#a8653a}
.to{font-size:17px;color:#5b6478}
.name{font-size:44px;font-weight:700;border-bottom:3px solid var(--accent);padding:0 14mm 2mm}
.txt{font-size:18px;line-height:2;max-width:210mm}
.meta{position:absolute;bottom:14mm;left:18mm;right:18mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:#5b6478}
.meta .qr img,.meta .qr canvas{width:24mm!important;height:24mm!important}
.verify{max-width:520px;margin:12vh auto;background:#fff;border-radius:16px;padding:24px;text-align:center;line-height:1.9}
@media print{ body{background:#fff} .bar{display:none} .cert{margin:0} @page{size:A4 landscape;margin:0} }
@media screen and (max-width:1150px){ .cert{transform:scale(calc(100vw / 1150px));transform-origin:top center;margin-bottom:calc(-210mm * (1 - 100vw / 1150px))} }
</style>
</head>
<body data-noannounce>
<div class="bar" id="bar" style="display:none"><button onclick="print()"><i data-icon="printer"></i> طباعة / حفظ PDF</button></div>
<div id="out"><div class="verify">جارٍ التحقق من الشهادة…</div></div>
<script>
const esc = APP.esc;
const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
const KIND = {
  participant: ['<i data-icon="award"></i>', "شهادة مشاركة", "تقديرًا لمشاركته الفاعلة في"],
  finalist: ['<i data-icon="award"></i>', "شهادة تأهل", "لتأهل مشروعه إلى التحكيم النهائي في"],
  winner1: ['<i data-icon="trophy" class="medal-1"></i>', "شهادة فوز · المركز الأول", "لفوزه بالمركز الأول في"],
  winner2: ['<i data-icon="trophy" class="medal-2"></i>', "شهادة فوز · المركز الثاني", "لفوزه بالمركز الثاني في"],
  winner3: ['<i data-icon="trophy" class="medal-3"></i>', "شهادة فوز · المركز الثالث", "لفوزه بالمركز الثالث في"],
};
APP.ready.then(async () => {
  const out = document.getElementById("out");
  if (!code) { out.innerHTML = `<div class="verify"><h2>التحقق من شهادة</h2><p>أضف رمز الشهادة إلى الرابط: certificate.html?c=الرمز</p></div>`; return; }
  const r = await fetch("api/hack?action=cert&code=" + encodeURIComponent(code), {cache: "no-store"});
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.valid) { out.innerHTML = `<div class="verify"><div style="font-size:40px;color:#c0392b"><i data-icon="circle-x"></i></div><h2>شهادة غير صالحة</h2><p>لم نجد شهادة بالرمز <b dir="ltr">${esc(code)}</b>.</p></div>`; return; }
  document.documentElement.style.setProperty("--accent", d.brand.accent); if (d.brand.bg) document.documentElement.style.setProperty("--navy", d.brand.bg);
  const [medal, title, why] = KIND[d.kind] || KIND.participant;
  const date = new Date(d.date).toLocaleDateString("ar-SA-u-nu-latn", {year: "numeric", month: "long", day: "numeric"});
  out.innerHTML = `<div class="cert">
    ${(d.brand.logos||[]).length ? `<div class="logos">${d.brand.logos.map(l=>`<img class="logo" src="${esc(l.url)}" alt="">`).join("")}</div>` : ""}
    <div class="org">${esc(d.brand.orgName)} · ${esc(d.brand.eventName)}</div>
    <div class="medal">${medal}</div>
    <div class="kind">${APP.title(title)}</div>
    <div class="to">تُمنح هذه الشهادة إلى</div>
    <div class="name">${esc(d.name)}</div>
    <div class="txt">${why} <b>${esc(d.hackathon)}</b> ضمن فريق <b>${esc(d.team)}</b>${d.project ? ` بمشروع «<b>${esc(d.project)}</b>»` : ""}${d.label ? `، مسار ${esc(d.label)}` : ""}.</div>
    <div class="meta"><div>${date}</div><div style="text-align:center">رمز التحقق<br><b dir="ltr" style="font-size:14px;color:#1a1f36">${esc(d.code)}</b></div><div class="qr" id="qr"></div></div>
  </div>`;
  try { new QRCode(document.getElementById("qr"), {text: location.href, width: 200, height: 200}); } catch(e){}
  document.getElementById("bar").style.display = "flex";
  document.title = `${title} · ${d.name}`;
});
</script>
</body>
</html>
