<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبر فكرتك</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="icons.js"></script>
<script src="qrcode.min.js"></script>
<style>
.wrap{max-width:540px;padding-top:18px}
textarea{min-height:120px}
.count{font-size:12px;color:var(--muted);text-align:left;margin-top:4px}
.btn{margin-top:6px}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.8;font-size:15.5px;white-space:pre-wrap;animation:pop .3s ease}
.msg.inv-msg{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-top-right-radius:4px;box-shadow:var(--shadow)}
.msg.me{align-self:flex-end;background:var(--me);border-top-left-radius:4px}
.msg .who{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent);margin-bottom:4px;font-weight:700}
.typing{color:var(--muted);font-size:14px;padding:4px 8px}
.typing::after{content:"";animation:dots 1.2s infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result{text-align:center;padding:24px 18px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:5px 14px;border-radius:999px;margin-bottom:12px}
.badge.ok{background:var(--gold-soft);color:var(--gold)}
.badge.no{background:var(--soft);color:var(--muted)}
.big{font-size:32px;font-weight:700;color:var(--text);line-height:1.3}
.result.yes .big{color:var(--gold)}
.val{color:var(--muted);font-size:14px;margin-top:4px}
.verdict{font-size:16.5px;line-height:1.9;margin:16px 0;color:var(--text)}
.list{text-align:right;margin-top:16px}
.list h3{font-size:14px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.list li{margin:0 18px 6px 0;line-height:1.7;font-size:15px}
.tip{background:var(--soft);border-inline-start:3px solid var(--accent);border-radius:10px;padding:12px 14px;margin-top:16px;text-align:right;line-height:1.85}
.tip .lu{color:var(--accent)}
.err{text-align:center}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:12px;line-height:1.7}
.demo{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.meet{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;animation:pop .4s ease;box-shadow:var(--shadow)}
.av{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);flex:none}
.av .lu{width:22px;height:22px}
.meet small{color:var(--muted)}
.crit{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:14px;margin:6px 0;text-align:right}
.crit b{text-align:left;font-variant-numeric:tabular-nums}
.thresh{position:relative;height:12px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:999px;margin:30px 0 6px;overflow:visible}
.thresh i{display:block;height:100%;border-radius:999px;transition:width 1s ease}
.thresh .mark{position:absolute;top:-6px;bottom:-6px;width:2px;height:auto;background:var(--text);display:block;margin:0}
.thresh .mark::before,.thresh .mark::after{display:none}
.thresh .mark span{position:absolute;top:-20px;transform:translateX(50%);font-size:11px;color:var(--muted);white-space:nowrap}
.ticket{background:var(--card);border:1.5px dashed var(--gold);border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:14px;animation:pop .5s ease;box-shadow:var(--shadow)}
.ticket .tico{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--gold-soft);color:var(--gold)}
.ticket .tico .lu{width:26px;height:26px}
.ticket h2{justify-content:center;margin:10px 0 4px;font-size:21px}
.ticket .code{font-size:36px;font-weight:700;letter-spacing:6px;color:var(--navy);direction:ltr;font-family:ui-monospace,Menlo,monospace;margin:8px 0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px}
.ticket p{line-height:1.8}
.why{font-size:13px;color:var(--muted);text-align:right;margin:-2px 0 10px;line-height:1.7}
.why .nx{color:var(--text)}
.caps{font-size:13px;text-align:right;background:color-mix(in srgb,var(--bad) 5%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 25%,transparent);border-radius:12px;padding:10px;margin-top:10px;line-height:1.8}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);margin:4px 2px 10px;line-height:1.7;cursor:pointer}
.consent input{width:18px;height:18px;margin-top:4px;accent-color:var(--accent);flex:none}
.near{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center;line-height:1.8;box-shadow:var(--shadow)}
textarea.needfix{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 15%,transparent)}
/* الجهاز اللوحي في الجناح */
body.kiosk .wrap{max-width:640px}
body.kiosk .msg{font-size:17px}
body.kiosk .hint{display:none}
.kqr{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right}
.kqr #ticketQR{background:#fff;padding:8px;border-radius:10px;line-height:0}
.kqr p{max-width:260px;line-height:1.8;font-size:15px}
.kbar{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#fff;font-size:13px;text-align:center;padding:6px;z-index:6}
.near.warn{border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 4%,var(--card))}
.opts{display:grid;gap:10px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;font:inherit;color:var(--text);background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.ch .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);flex:none;font-size:20px}
.ch .ic .lu{width:21px;height:21px}
.ch b{display:block}
.ch small{color:var(--muted);font-size:13.5px;line-height:1.6;display:block}
.ch[aria-pressed=true]{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.subopts{display:grid;gap:8px;margin:2px 22px 4px 0;padding-right:12px;border-right:2px solid var(--accent)}
.subopts .ch{padding:10px 12px}
</style>
<script src="app.js"></script>
</head>
<body>
<header class="topbar">
  <div class="in">
    <div class="org"><span data-logo hidden></span><span data-text="brand.orgName"></span></div>
    <div class="mark"><i data-icon="briefcase-business"></i></div>
    <h1 data-title="investor.title">&nbsp;</h1>
    <p class="sub" data-text="investor.tagline"></p>
    <div class="chips" id="journey"></div>
  </div>
</header>
<div class="wrap">

  <!-- 1. البداية -->
  <section id="s-start">
    <div class="card">
      <div class="row2">
        <div><label for="name">اسمك</label><input id="name" maxlength="40" placeholder="مثال: عبدالله" autocomplete="name"></div>
        <div><label for="email">بريدك الإلكتروني</label><input id="email" type="email" dir="ltr" maxlength="80" placeholder="name@example.com" autocomplete="email"></div>
      </div>
      <p class="hint" style="text-align:right;margin-top:8px" id="emailHint"></p>
    </div>
    <div class="card hidden" id="trackCard">
      <label>اختر مسار فكرتك</label>
      <p class="hint" style="text-align:right;margin:-2px 0 10px">يُقيَّم مدى ارتباط فكرتك بالمسار الذي تختاره، ويُعتمد المسار نفسه لفريقك إن تأهلت.</p>
      <div class="opts" id="tracks"></div>
    </div>
    <div class="card">
      <label for="idea">فكرتك في ثلاثة أسطر: ما المشكلة؟ وما الحل؟</label>
      <textarea id="idea" maxlength="500" placeholder="مثال: تطبيق يربط طلاب الجامعة الساكنين في الحي نفسه ليتشاركوا التنقل ويخفّضوا تكلفة الوقود."></textarea>
      <div class="count"><span id="ideaCount">0</span>/500</div>
    </div>
    <label class="consent"><input type="checkbox" id="consent"> <span>أوافق على استخدام بياناتي لأغراض البرنامج</span></label>
    <div class="card hidden" id="otpBox" style="text-align:center">
      <b><i data-icon="mail"></i> أرسلنا رمز تحقق إلى بريدك</b>
      <p class="hint" style="margin-top:4px" id="otpTo"></p>
      <input id="otpCode" dir="ltr" inputmode="numeric" maxlength="6" placeholder="------" style="text-align:center;letter-spacing:8px;font-size:22px;margin-top:8px">
      <button class="btn" id="otpBtn">تحقّق وابدأ</button>
      <button class="btn ghost" id="otpResend" style="font-size:14px;padding:8px">إعادة إرسال الرمز</button>
      <p class="err" id="otpErr"></p>
    </div>
    <button class="btn" id="startBtn">اعرض فكرتي <i data-icon="send"></i></button>
    <p class="err" id="startErr"></p>
  </section>

  <!-- 2. المحادثة -->
  <section id="s-chat" class="hidden">
    <div class="meet" id="meet"></div>
    <div class="chat" id="chat"></div>
    <p class="note hidden" id="queueNote" style="font-size:14px;margin-bottom:12px;text-align:center"></p>
    <div class="card" id="answerBox">
      <label for="answer">إجابتك</label>
      <textarea id="answer" maxlength="300" style="min-height:90px" placeholder="الرجاء الإجابة باختصار ووضوح..."></textarea>
      <button class="btn" id="answerBtn">أرسل الإجابة</button>
      <p class="err" id="chatErr"></p>
    </div>
  </section>

  <!-- 3. النتيجة -->
  <section id="s-result" class="hidden">
    <div id="qualBox"></div>
    <div class="card result" id="resultCard"></div>
    <p class="hint"><i data-icon="camera"></i> يمكنك تصوير الشاشة ومشاركتها، ومتابعة النتائج على الشاشة الكبيرة في الجناح.</p>
    <button class="btn ghost" id="againBtn" style="margin-top:14px"></button>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = APP.esc, fmt = APP.fmt;
let CFG, INVESTORS = {}, PROBLEMS = [];
const state = {investor:"", name:"", email:"", track:"", challenge:null, idea:"", questions:[], answers:[], clarified:[], consent:false, token:""};
const SS = { get(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{sessionStorage.setItem(k,v)}catch(e){} } };
let attemptsLeft = null;
const LS = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

APP.ready.then(c => {
  CFG = c;
  if (!c.modules.investor) return APP.disabled(`${c.investor.title} غير متاح حاليًا`);
  document.title = c.investor.title;
  INVESTORS = Object.fromEntries(c.investor.investors.map(i => [i.id, i]));
  TRACKS = c.investor.chooseTrack !== false && c.modules.hackathon && c.hackathon.tracks.length > 0;
  $("trackCard").classList.toggle("hidden", !TRACKS); if (TRACKS) renderTracks();
  const gate = c.modules.hackathon && c.hackathon.registration === "ticket";
  $("journey").innerHTML = gate
    ? `<span><i data-icon="lightbulb"></i> اعرض فكرتك</span><span><i data-icon="message-square"></i> أجب عن سؤالين</span><span><i data-icon="ticket"></i> ${c.investor.qualifyScore}+ للتأهل إلى ${esc(c.hackathon.name)}</span>`
    : `<span><i data-icon="lightbulb"></i> اعرض فكرتك</span><span><i data-icon="message-square"></i> أجب عن سؤالين</span><span><i data-icon="chart-column"></i> احصل على تقييمك</span>`;
  $("emailHint").textContent = `لكل بريد ${c.investor.maxAttempts} محاولات.` + (c.modules.hackathon ? " تُربط به محاولاتك وتأهلك." : "");
}).catch(()=>{ $("startErr").textContent = "تعذّر تحميل الإعدادات، يُرجى تحديث الصفحة"; });

let TRACKS = false;
// اختيار المسار والتحدي قبل عرض الفكرة
function renderTracks(){
  const box = $("tracks"); box.innerHTML = "";
  for (const t of CFG.hackathon.tracks) {
    const on = state.track === t.id;
    const b = document.createElement("button"); b.type = "button"; b.className = "ch"; b.setAttribute("aria-pressed", on ? "true" : "false");
    b.innerHTML = `<span class="ic">${glyph(t.icon)}</span><span><b>${esc(t.title)}</b><small>${esc(t.desc)}</small>${t.challenges.length ? `<small class="gold">${t.challenges.length} تحديات ${on ? "▾" : "◂"}</small>` : ""}</span>`;
    b.onclick = () => { state.track = t.id; state.challenge = t.challenges.length === 1 ? t.challenges[0].id : null; renderTracks(); };
    box.appendChild(b);
    if (on && t.challenges.length) {
      const sub = document.createElement("div"); sub.className = "subopts";
      for (const c of t.challenges) {
        const cb = document.createElement("button"); cb.type = "button"; cb.className = "ch"; cb.setAttribute("aria-pressed", state.challenge === c.id ? "true" : "false");
        cb.innerHTML = `<span><b>${esc(c.title)}</b><small>${esc(c.desc)}</small></span>`;
        cb.onclick = () => { state.challenge = c.id; renderTracks(); };
        sub.appendChild(cb);
      }
      box.appendChild(sub);
    }
  }
}
const KIOSK = Boolean(APP.kiosk);
if (KIOSK) document.body.classList.add("kiosk");
// على الجهاز اللوحي المشترك لا نتذكر بيانات الزائر السابق
$("name").value = KIOSK ? "" : (LS.get("si_name") || "");
$("email").value = KIOSK ? "" : (LS.get("si_email") || "");
$("idea").oninput = () => $("ideaCount").textContent = $("idea").value.length;

// ---------- الجهاز اللوحي: إعادة الضبط التلقائية ----------
let idleT = null;
function kioskReset(){
  ["name","email","idea","answer"].forEach(id => { $(id).value = ""; });
  $("consent").checked = false; $("idea").oninput?.();
  state.track = ""; state.challenge = null; if (TRACKS) renderTracks();
  state.investor = ""; state.questions = []; state.answers = []; state.clarified = []; state.token = "";
  $("chat").innerHTML = ""; $("meet").innerHTML = ""; $("qualBox").innerHTML = ""; $("resultCard").innerHTML = "";
  ["startErr","chatErr"].forEach(id => $(id) && ($(id).textContent = ""));
  try { sessionStorage.clear(); if (APP.kiosk) sessionStorage.setItem("kiosk", APP.kiosk); } catch(e){}
  show("s-start");
}
function kioskIdle(){
  if (!KIOSK) return;
  clearTimeout(idleT);
  const busy = !$("s-start").classList.contains("hidden") && !$("name").value && !$("idea").value;
  if (busy) return; // لا شيء لمسحه
  idleT = setTimeout(kioskReset, (CFG?.booth?.kioskIdle || 90) * 1000);
}
if (KIOSK) ["pointerdown","keydown","input","scroll"].forEach(ev => addEventListener(ev, kioskIdle, {passive:true}));

function show(id){ ["s-start","s-chat","s-result"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); if (typeof kioskIdle === "function") kioskIdle(); }
function inv(){ return INVESTORS[state.investor] || {name:"المستشار", emoji:"briefcase-business"}; }
function addMsg(text, me){
  const m = document.createElement("div");
  m.className = "msg " + (me ? "me" : "inv-msg");
  m.innerHTML = (me ? "" : `<span class="who">${glyph(inv().emoji)} ${esc(inv().name)}</span>`) + esc(text);
  $("chat").appendChild(m);
  m.scrollIntoView({behavior:"smooth", block:"end"});
}
function typing(on){
  let t = $("typing");
  if (on && !t){ t=document.createElement("div"); t.id="typing"; t.className="typing"; t.textContent=(state.investor?inv().name:"المستشار")+" يراجع إجابتك"; $("chat").appendChild(t); t.scrollIntoView({behavior:"smooth",block:"end"}); }
  if (!on && t) t.remove();
}
async function call(){
  const r = await fetch("api/pitch", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(state)});
  const d = await r.json();
  if (!r.ok) { const e = new Error(d.error || "حدث خطأ"); e.status = r.status; e.needVerify = d.needVerify; e.retry = d.retry || r.status === 502 || r.status === 504; throw e; }
  return d;
}
// طابور انتظار: عند ازدحام الخدمة يُعاد الطلب تلقائيًا مع عدّاد، بدل رسالة خطأ
async function callQ(note){
  for (let i = 0; ; i++) {
    try { const d = await call(); note(""); return d; }
    catch(e){
      if (!e.retry || i >= 5) { note(""); throw e; }
      for (let t = 6 + i * 5; t > 0; t--) { note(`الطلبات كثيرة في هذه اللحظة، وسيُعاد إرسال طلبك تلقائيًا خلال ${t} ثانية… الرجاء عدم إغلاق الصفحة.`); await new Promise(r => setTimeout(r, 1000)); }
      note("جارٍ إعادة الإرسال…");
    }
  }
}

$("startBtn").onclick = async () => {
  state.name = $("name").value.trim(); state.email = $("email").value.trim().toLowerCase(); state.idea = $("idea").value.trim();
  $("startErr").textContent = "";
  if (state.name.length < 2) return $("startErr").textContent = "يُرجى كتابة اسمك";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(state.email)) return $("startErr").textContent = "الرجاء كتابة بريد إلكتروني صحيح";
  if (TRACKS) {
    const t = CFG.hackathon.tracks.find(x => x.id === state.track);
    if (!t) return $("startErr").textContent = "الرجاء اختيار مسار فكرتك";
    if (t.challenges.length && !state.challenge) return $("startErr").textContent = "الرجاء اختيار التحدي داخل المسار";
  }
  if (state.idea.length < 15) return $("startErr").textContent = "يُرجى توضيح فكرتك أكثر (المشكلة والحل)";
  state.consent = $("consent").checked;
  if (!state.consent) return $("startErr").textContent = "الرجاء الموافقة على استخدام البيانات لأغراض البرنامج";
  if (!KIOSK) { LS.set("si_name", state.name); LS.set("si_email", state.email); }
  // التحقق من البريد (إن كان مفعّلًا)
  if (CFG.features?.verifyEmail) {
    state.token = SS.get("otp:" + state.email) || "";
    if (!state.token) return sendOtp();
  }
  await begin();
};
async function otpApi(action, body){
  const r = await fetch("api/pitch?action=" + action, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const d = await r.json(); if (!r.ok) throw new Error(d.error || "خطأ"); return d;
}
async function sendOtp(){
  $("otpErr").textContent = ""; $("startBtn").disabled = true;
  try { await otpApi("otp-send", {email: state.email}); $("otpTo").textContent = state.email; $("otpBox").classList.remove("hidden"); $("startBtn").classList.add("hidden"); $("otpCode").focus(); }
  catch(e){ $("startErr").textContent = e.message; }
  $("startBtn").disabled = false;
}
$("otpResend").onclick = sendOtp;
$("otpBtn").onclick = async () => {
  $("otpErr").textContent = "";
  try {
    const d = await otpApi("otp-check", {email: state.email, code: $("otpCode").value.trim()});
    state.token = d.token; SS.set("otp:" + state.email, d.token);
    $("otpBox").classList.add("hidden"); $("startBtn").classList.remove("hidden");
    await begin();
  } catch(e){ $("otpErr").textContent = e.message; }
};
async function begin(){
  state.investor = ""; state.questions=[]; state.answers=[]; state.clarified=[]; $("chat").innerHTML=""; $("meet").innerHTML="";
  $("startBtn").disabled = true;
  try {
    typing(false);
    const d = await callQ(t => { $("startErr").textContent = t; $("startErr").style.color = t ? "var(--muted)" : ""; });
    state.investor = d.investor; attemptsLeft = d.attemptsLeft;
    show("s-chat");
    $("meet").innerHTML = `<span class="av">${glyph(inv().emoji)}</span><span><b>يقيّم فكرتك: ${esc(inv().name)}</b><br><small>${esc(inv().title||"")}${inv().desc?" · "+esc(inv().desc):""}</small></span>`;
    addMsg(state.idea, true);
    state.questions.push(d.question); addMsg(d.question, false);
    $("answer").value=""; $("answerBox").classList.remove("hidden"); $("answer").focus();
  } catch(e){
    $("startErr").textContent = e.message;
    if (e.status === 422) { $("idea").focus(); $("idea").classList.add("needfix"); setTimeout(()=>$("idea").classList.remove("needfix"), 2500); }
    if (e.needVerify) { SS.set("otp:" + state.email, ""); sendOtp(); }
  }
  $("startBtn").disabled = false;
}

async function nextTurn(){
  $("answerBox").classList.add("hidden");
  typing(true);
  try {
    const d = await callQ(t => { $("queueNote").textContent = t; $("queueNote").classList.toggle("hidden", !t); });
    typing(false);
    if (d.clarify != null) {
      // الإجابة لم تُقبل: يطلب المستشار توضيحًا مرة واحدة لهذا السؤال
      state.answers.pop(); state.clarified.push(d.clarify);
      addMsg(d.message, false);
      $("answer").value=""; $("answer").placeholder = "الرجاء الإجابة بمعلومة محددة..."; $("answerBox").classList.remove("hidden"); $("chatErr").textContent="";
      $("answer").focus();
    } else if (d.step <= 2) {
      state.questions.push(d.question);
      addMsg(d.question, false);
      $("answer").value=""; $("answer").placeholder = "الرجاء الإجابة باختصار ووضوح..."; $("answerBox").classList.remove("hidden"); $("chatErr").textContent="";
      $("answer").focus();
    } else {
      attemptsLeft = d.attemptsLeft;
      showResult(d);
    }
  } catch(e) {
    typing(false);
    $("answerBox").classList.remove("hidden");
    $("chatErr").textContent = e.message;
    if (e.status !== 429) $("answerBtn").onclick = () => { $("chatErr").textContent=""; $("answerBtn").onclick = sendAnswer; nextTurn(); };
  }
}

$("answerBtn").onclick = sendAnswer;
async function sendAnswer(){
  const a = $("answer").value.trim();
  if (a.length < 3) return $("chatErr").textContent = "يُرجى كتابة إجابتك";
  state.answers.push(a);
  addMsg(a, true);
  await nextTurn();
}

function showResult(d){
  const r = d.result, ok = r.decision === "invest", H = CFG.hackathon, gate = CFG.modules.hackathon;
  const pct = r.score, th = r.qualifyScore;
  // بطاقة التأهل أو "قريب منها"
  if (d.ticket) {
    $("qualBox").innerHTML = `<div class="ticket">
      <span class="tico"><i data-icon="ticket"></i></span>
      <h2>مبروك، تأهلت إلى ${esc(H.name)}</h2>
      <p class="muted" style="font-size:14px">${d.emailed ? `الرجاء الاحتفاظ بهذا الرمز، فهو رمز تسجيلك، وقد أُرسل أيضًا إلى ${esc(state.email)}.` : "الرجاء الاحتفاظ بهذا الرمز، فهو رمز تسجيلك."}</p>
      <div class="code">${esc(d.ticket)}</div>
      <p style="font-size:14px">الرجاء تسجيل أعضاء الفريق في صفحة ${esc(H.name)}، وستُضاف الفكرة وملاحظات المستشار تلقائيًا.</p>
      ${KIOSK ? `<div class="kqr"><div id="ticketQR"></div><p><b>الرجاء مسح الرمز بالجوال</b><br>لتسجيل أعضاء الفريق من جوالك، وستُضاف الفكرة والملاحظات تلقائيًا.</p></div>`
        : `<a class="btn" id="goHack" href="hackathon.html?ticket=${encodeURIComponent(d.ticket)}" style="margin-top:12px">أكمل التسجيل في ${esc(H.name)} <i data-icon="arrow-left"></i></a>`}
    </div>`;
    if (KIOSK) { try { new QRCode($("ticketQR"), {text: new URL("hackathon.html?ticket=" + encodeURIComponent(d.ticket), location.href).href, width: 200, height: 200}); } catch(e){} }
    else try { localStorage.setItem("hack_import", JSON.stringify({
      ticket:d.ticket, dealId:d.dealId, name:state.name, email:state.email, idea:state.idea, title:r.title, investor:inv().name, decision:r.decision,
      verdict:r.verdict, strengths:r.strengths, weaknesses:r.weaknesses, tip:r.tip, score:r.score, at:Date.now() })); } catch(e){}
  } else if (gate && !r.qualified) {
    $("qualBox").innerHTML = `<div class="near"><b>${r.offTrack ? `فكرتك لا ترتبط بالمسار المختار، لذا لم تتأهل إلى ${esc(H.name)}` : `ينقصك ${th - pct} درجة للتأهل إلى ${esc(H.name)}`}</b><br>
      <span class="muted" style="font-size:14px">${attemptsLeft > 0 ? `نأمل تطوير الفكرة وفق الملاحظات وإعادة المحاولة. المحاولات المتبقية: ${attemptsLeft}.` : "استنفدت محاولاتك بهذا البريد."}${d.emailed ? `<br><i data-icon="mail"></i> أرسلنا نتيجتك وأهم ما تحسّنه إلى ${esc(state.email)}.` : ""}</span></div>`;
  } else $("qualBox").innerHTML = "";

  $("resultCard").classList.toggle("yes", ok);
  $("resultCard").innerHTML = `
    <span class="badge ${ok?"ok":"no"}">${ok ? '<i data-icon="award"></i> مبروك' : '<i data-icon="clipboard-list"></i> نتيجة التقييم'}</span>
    <div style="font-size:15px;color:var(--muted)">${glyph(inv().emoji)} ${esc(inv().name)} عن «${esc(r.title)}»</div>
    ${ok ? `<div class="big">${gate ? "متأهل" : "قرار إيجابي"}</div><div class="val">${gate ? `تجاوزت فكرتك حد التأهل (${th} من 100)` : "تقييم إيجابي لفكرتك"}</div>` : `<div class="big">غير متأهل</div><div class="val">${attemptsLeft > 0 ? `${attemptsLeft===1?"لديك محاولة واحدة متبقية":attemptsLeft===2?"لديك محاولتان متبقيتان":`لديك ${attemptsLeft} محاولات متبقية`} لتطوير فكرتك وإعادة التقديم` : "استنفدت المحاولات المتاحة لهذا البريد"}</div>`}
    <p class="verdict">«${esc(r.verdict)}»</p>
    <div style="font-size:15px">درجة فكرتك: <b style="font-size:22px;color:var(--accent)">${pct}</b> / 100</div>
    <div class="thresh"><i id="scoreBar" style="width:0;background:${r.qualified?"var(--good)":"var(--accent)"}"></i>${gate?`<div class="mark" style="right:${th}%"><span style="${th>80?"transform:none;left:0":th<15?"transform:translateX(100%)":""}">حد التأهل ${th}</span></div>`:""}</div>
    <div style="margin-top:14px">${(r.criteria||[]).map(c=>`<div class="crit"><span>${esc(c.label)}</span><div class="bar"><i data-w="${(r.scores?.[c.key]||0)/c.max*100}%" style="width:0"></i></div><b>${r.scores?.[c.key]??0}/${c.max}</b></div>
      ${c.reason?`<div class="why">${c.capped?'<i data-icon="lock"></i> ':""}${esc(c.reason)}${c.next?`<br><span class="nx"><i data-icon="arrow-up"></i> ${esc(c.next)}</span>`:""}</div>`:""}`).join("")}</div>
    ${(r.capsApplied||[]).length?`<div class="caps"><b><i data-icon="lock"></i> قيود طُبّقت على الدرجة:</b> ${r.capsApplied.map(esc).join("، ")}</div>`:""}
    <div class="list"><h3><i data-icon="circle-check"></i> نقاط القوة</h3><ul>${r.strengths.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    <div class="list"><h3><i data-icon="wrench"></i> فرص التحسين</h3><ul>${r.weaknesses.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    <div class="tip"><i data-icon="lightbulb"></i> <b>توصية المستشار:</b> ${esc(r.tip)}</div>
    <div style="margin-top:14px;font-size:13px;color:var(--muted)">${esc(state.name)} · ${esc(CFG.brand.eventName)} · ${esc(CFG.brand.orgName)}</div>
    ${d.demo ? `<p class="demo" style="color:var(--bad);font-weight:700"><i data-icon="triangle-alert"></i> تقييم وهمي: الذكاء الاصطناعي غير مفعّل</p>` : ""}`;
  if (d.demo) $("qualBox").insertAdjacentHTML("afterbegin", `<div class="near warn"><b style="color:var(--bad)"><i data-icon="triangle-alert"></i> هذا تقييم وهمي عشوائي للعرض فقط</b><br><span style="font-size:14px">الذكاء الاصطناعي غير مفعّل، فالأسئلة ثابتة والدرجات عشوائية. فعّله من لوحة التحكم ← نظرة عامة.</span></div>`);
  if (KIOSK) $("againBtn").innerHTML = '<i data-icon="rotate-ccw"></i> انتهيت، ابدأ عرضًا جديدًا';
  else $("againBtn").textContent = d.ticket ? "اعرض فكرة أخرى" : (attemptsLeft > 0 ? `أعد المحاولة (المتبقي: ${attemptsLeft})` : "اعرض فكرة ببريد آخر");
  show("s-result");
  setTimeout(()=>{ $("scoreBar").style.width = r.score+"%"; document.querySelectorAll("#resultCard .bar i").forEach(i=>i.style.width=i.dataset.w); }, 100);
}
$("againBtn").onclick = () => { if (KIOSK) return kioskReset(); if (attemptsLeft === 0) $("email").value = ""; $("idea").value = attemptsLeft > 0 && !$("qualBox").querySelector(".ticket") ? state.idea : ""; $("idea").oninput(); show("s-start"); };
</script>
</body>
</html>
