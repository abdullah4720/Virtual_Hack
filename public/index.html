<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المستثمر الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--card:#141b31;--line:#25304f;--text:#eef2ff;--muted:#9aa6c7;
  --accent:#f5b83d;--accent-ink:#1a1204;--good:#34d399;--bad:#f87171;--me:#2b3a66;
}
*{box-sizing:border-box;margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1d2a55 0,transparent 60%),var(--bg);color:var(--text);min-height:100dvh}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;padding:12px 0 20px}
.logo{font-size:44px}
h1{font-size:26px;font-weight:700;margin-top:4px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:#0e1427;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:120px;resize:vertical;line-height:1.7}
.count{font-size:12px;color:var(--muted);text-align:left;margin-top:4px}
.investors{display:grid;gap:10px}
.inv{display:flex;align-items:center;gap:12px;text-align:right;width:100%;font:inherit;color:var(--text);background:#0e1427;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.inv .em{font-size:30px}
.inv b{display:block;font-size:16px}
.inv small{color:var(--muted);font-size:13px}
.inv[aria-pressed=true]{border-color:var(--accent);background:#1f2440}
.btn{width:100%;font:inherit;font-size:17px;font-weight:700;border:0;border-radius:14px;padding:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.75;font-size:15.5px;white-space:pre-wrap;animation:pop .3s ease}
.msg.inv-msg{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-top-right-radius:4px}
.msg.me{align-self:flex-end;background:var(--me);border-top-left-radius:4px}
.msg .who{display:block;font-size:12px;color:var(--accent);margin-bottom:4px;font-weight:700}
.typing{color:var(--muted);font-size:14px;padding:4px 8px}
.typing::after{content:"";animation:dots 1.2s infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result{text-align:center;padding:24px 18px}
.badge{display:inline-block;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:12px}
.badge.ok{background:rgba(52,211,153,.15);color:var(--good)}
.badge.no{background:rgba(248,113,113,.15);color:var(--bad)}
.big{font-size:34px;font-weight:700;color:var(--accent);line-height:1.3}
.val{color:var(--muted);font-size:14px;margin-top:4px}
.verdict{font-size:17px;line-height:1.8;margin:16px 0}
.score{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
.bar{flex:1;height:10px;background:#0e1427;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));border-radius:999px;transition:width 1s ease}
.list{text-align:right;margin-top:14px}
.list h3{font-size:14px;color:var(--muted);margin-bottom:6px}
.list li{margin:0 18px 6px 0;line-height:1.7;font-size:15px}
.tip{background:#1f2440;border:1px dashed var(--accent);border-radius:14px;padding:12px;margin-top:14px;text-align:right;line-height:1.8}
.err{color:var(--bad);font-size:14px;margin-top:8px;text-align:center}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:12px;line-height:1.7}
.hidden{display:none}
.demo{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
[data-logo] img{max-height:54px;max-width:200px}
.bridge{display:block;margin-top:14px;text-decoration:none;color:inherit;text-align:center;border-color:var(--accent)!important}
.bridge b{color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.steps span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.meet{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;animation:pop .4s ease}
.meet .em{font-size:30px}
.meet small{color:var(--muted)}
.crit{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:14px;margin:6px 0;text-align:right}
.crit b{text-align:left}
.thresh{position:relative;height:12px;background:#0e1427;border-radius:999px;margin:30px 0 6px;overflow:visible}
.thresh i{display:block;height:100%;border-radius:999px;transition:width 1s ease}
.thresh .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--text)}
.thresh .mark span{position:absolute;top:-20px;transform:translateX(50%);font-size:11px;color:var(--muted);white-space:nowrap}
.ticket{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--card)),var(--card));border:1.5px dashed var(--accent);border-radius:18px;padding:20px;text-align:center;margin-bottom:14px;animation:pop .5s ease}
.ticket .code{font-size:38px;font-weight:700;letter-spacing:6px;color:var(--accent);direction:ltr;font-family:ui-monospace,Menlo,monospace;margin:6px 0}
.ticket p{line-height:1.8}
.why{font-size:13px;color:var(--muted);text-align:right;margin:-2px 0 10px;line-height:1.7}
.why .nx{color:var(--text)}
.caps{font-size:13px;text-align:right;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:12px;padding:10px;margin-top:10px;line-height:1.8}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);margin:4px 2px 10px;line-height:1.7;cursor:pointer}
.consent input{width:18px;height:18px;margin-top:4px;accent-color:var(--accent);flex:none}
.consent a{color:var(--accent)}
.near{background:#1f2440;border-radius:14px;padding:14px;margin-bottom:14px;text-align:center;line-height:1.8}
</style>
<script src="app.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div data-logo hidden style="margin-bottom:8px"></div>
    <div class="logo">💼</div>
    <h1 data-title="investor.title">المستثمر الذكي</h1>
    <p class="sub" data-text="investor.tagline"></p>
    <div class="steps" id="journey"></div>
  </header>

  <!-- 1. البداية -->
  <section id="s-start">
    <div class="card">
      <div class="row2">
        <div><label for="name">اسمك</label><input id="name" maxlength="40" placeholder="مثال: عبدالله" autocomplete="name"></div>
        <div><label for="email">بريدك الإلكتروني</label><input id="email" type="email" dir="ltr" maxlength="80" placeholder="name@example.com" autocomplete="email"></div>
      </div>
      <p class="hint" style="text-align:right;margin-top:8px" id="emailHint"></p>
    </div>
    <div class="card">
      <label for="idea">فكرتك في 3 أسطر: وش المشكلة؟ ووش الحل؟</label>
      <textarea id="idea" maxlength="500" placeholder="مثال: تطبيق يربط طلاب الجامعة اللي ساكنين بنفس الحي عشان يتشاركون المشوار ويوفرون في البنزين."></textarea>
      <div class="count"><span id="ideaCount">0</span>/500</div>
      <button class="btn ghost" id="randomIdea" type="button" style="margin-top:10px;font-size:15px">🎲 ما عندي فكرة؟ اسحب مشكلة عشوائية</button>
    </div>
    <label class="consent"><input type="checkbox" id="consent"> <span>أوافق على <a href="privacy.html" target="_blank">سياسة الخصوصية</a> واستخدام بياناتي لأغراض البرنامج</span></label>
    <div class="card hidden" id="otpBox" style="text-align:center">
      <b>📧 أرسلنا رمز تحقق إلى بريدك</b>
      <p class="hint" style="margin-top:4px" id="otpTo"></p>
      <input id="otpCode" dir="ltr" inputmode="numeric" maxlength="6" placeholder="------" style="text-align:center;letter-spacing:8px;font-size:22px;margin-top:8px">
      <button class="btn" id="otpBtn">تحقّق وابدأ</button>
      <button class="btn ghost" id="otpResend" style="font-size:14px;padding:8px">إعادة إرسال الرمز</button>
      <p class="err" id="otpErr"></p>
    </div>
    <button class="btn" id="startBtn">اعرض فكرتي 🚀</button>
    <p class="err" id="startErr"></p>
  </section>

  <!-- 2. المحادثة -->
  <section id="s-chat" class="hidden">
    <div class="meet" id="meet"></div>
    <div class="chat" id="chat"></div>
    <div class="card" id="answerBox">
      <label for="answer">إجابتك</label>
      <textarea id="answer" maxlength="300" style="min-height:90px" placeholder="جاوب باختصار ووضوح..."></textarea>
      <button class="btn" id="answerBtn">أرسل الإجابة</button>
      <p class="err" id="chatErr"></p>
    </div>
  </section>

  <!-- 3. النتيجة -->
  <section id="s-result" class="hidden">
    <div id="qualBox"></div>
    <div class="card result" id="resultCard"></div>
    <p class="hint">📸 صوّر الشاشة وشاركها! وتابع ترتيبك على الشاشة الكبيرة في الجناح.</p>
    <button class="btn ghost" id="againBtn" style="margin-top:14px"></button>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = APP.esc, fmt = APP.fmt;
let CFG, INVESTORS = {}, PROBLEMS = [];
const state = {investor:"", name:"", email:"", idea:"", questions:[], answers:[], consent:false, token:""};
const SS = { get(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{sessionStorage.setItem(k,v)}catch(e){} } };
let attemptsLeft = null;
const LS = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

APP.ready.then(c => {
  CFG = c;
  if (!c.modules.investor) return APP.disabled(`${c.investor.title} غير متاح حاليًا`);
  document.title = c.investor.title;
  INVESTORS = Object.fromEntries(c.investor.investors.map(i => [i.id, i]));
  PROBLEMS = c.investor.problems;
  $("randomIdea").classList.toggle("hidden", !PROBLEMS.length);
  const gate = c.modules.hackathon && c.hackathon.registration === "ticket";
  $("journey").innerHTML = gate
    ? `<span>① اعرض فكرتك</span><span>② جاوب سؤالين</span><span>③ ${c.investor.qualifyScore}+ = تتأهل إلى ${esc(c.hackathon.name)} 🎟️</span>`
    : `<span>① اعرض فكرتك</span><span>② جاوب سؤالين</span><span>③ يستثمر ولا يطلع؟</span>`;
  $("emailHint").textContent = `لكل بريد ${c.investor.maxAttempts} محاولات.` + (c.modules.hackathon ? " نربط به محاولاتك وتأهلك." : "");
}).catch(()=>{ $("startErr").textContent = "تعذر تحميل الإعدادات، حدّث الصفحة"; });

$("name").value = LS.get("si_name") || "";
$("email").value = LS.get("si_email") || "";
$("idea").oninput = () => $("ideaCount").textContent = $("idea").value.length;
$("randomIdea").onclick = () => {
  const p = PROBLEMS[Math.floor(Math.random()*PROBLEMS.length)];
  $("idea").value = "المشكلة: " + p + "\nالحل: ";
  $("idea").focus(); $("idea").oninput();
};

function show(id){ ["s-start","s-chat","s-result"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }
function inv(){ return INVESTORS[state.investor] || {name:"المستثمر", emoji:"💼"}; }
function addMsg(text, me){
  const m = document.createElement("div");
  m.className = "msg " + (me ? "me" : "inv-msg");
  m.innerHTML = (me ? "" : `<span class="who">${esc(inv().emoji)} ${esc(inv().name)}</span>`) + esc(text);
  $("chat").appendChild(m);
  m.scrollIntoView({behavior:"smooth", block:"end"});
}
function typing(on){
  let t = $("typing");
  if (on && !t){ t=document.createElement("div"); t.id="typing"; t.className="typing"; t.textContent=(state.investor?inv().name:"المستثمر")+" يفكّر"; $("chat").appendChild(t); t.scrollIntoView({behavior:"smooth",block:"end"}); }
  if (!on && t) t.remove();
}
async function call(){
  const r = await fetch("api/pitch", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(state)});
  const d = await r.json();
  if (!r.ok) { const e = new Error(d.error || "صار خطأ"); e.status = r.status; e.needVerify = d.needVerify; throw e; }
  return d;
}

$("startBtn").onclick = async () => {
  state.name = $("name").value.trim(); state.email = $("email").value.trim().toLowerCase(); state.idea = $("idea").value.trim();
  $("startErr").textContent = "";
  if (state.name.length < 2) return $("startErr").textContent = "اكتب اسمك أول 🙂";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(state.email)) return $("startErr").textContent = "اكتب بريدًا إلكترونيًا صحيحًا";
  if (state.idea.length < 15) return $("startErr").textContent = "وضّح فكرتك أكثر (المشكلة والحل)";
  state.consent = $("consent").checked;
  if (!state.consent) return $("startErr").textContent = "يلزم الموافقة على سياسة الخصوصية";
  LS.set("si_name", state.name); LS.set("si_email", state.email);
  // التحقق من البريد (إن كان مفعّلًا)
  if (CFG.features?.verifyEmail) {
    state.token = SS.get("otp:" + state.email) || "";
    if (!state.token) return sendOtp();
  }
  await begin();
};
async function otpApi(action, body){
  const r = await fetch("api/pitch?action=" + action, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const d = await r.json(); if (!r.ok) throw new Error(d.error || "خطأ"); return d;
}
async function sendOtp(){
  $("otpErr").textContent = ""; $("startBtn").disabled = true;
  try { await otpApi("otp-send", {email: state.email}); $("otpTo").textContent = state.email; $("otpBox").classList.remove("hidden"); $("startBtn").classList.add("hidden"); $("otpCode").focus(); }
  catch(e){ $("startErr").textContent = e.message; }
  $("startBtn").disabled = false;
}
$("otpResend").onclick = sendOtp;
$("otpBtn").onclick = async () => {
  $("otpErr").textContent = "";
  try {
    const d = await otpApi("otp-check", {email: state.email, code: $("otpCode").value.trim()});
    state.token = d.token; SS.set("otp:" + state.email, d.token);
    $("otpBox").classList.add("hidden"); $("startBtn").classList.remove("hidden");
    await begin();
  } catch(e){ $("otpErr").textContent = e.message; }
};
async function begin(){
  state.investor = ""; state.questions=[]; state.answers=[]; $("chat").innerHTML=""; $("meet").innerHTML="";
  $("startBtn").disabled = true;
  try {
    typing(false);
    const d = await call();
    state.investor = d.investor; attemptsLeft = d.attemptsLeft;
    show("s-chat");
    $("meet").innerHTML = `<span class="em">${esc(inv().emoji)}</span><span><b>يقابلك الآن: ${esc(inv().name)}</b><br><small>${esc(inv().title||"")}${inv().desc?" · "+esc(inv().desc):""}</small></span>`;
    addMsg(state.idea, true);
    state.questions.push(d.question); addMsg(d.question, false);
    $("answer").value=""; $("answerBox").classList.remove("hidden"); $("answer").focus();
  } catch(e){
    $("startErr").textContent = e.message;
    if (e.needVerify) { SS.set("otp:" + state.email, ""); sendOtp(); }
  }
  $("startBtn").disabled = false;
}

async function nextTurn(){
  $("answerBox").classList.add("hidden");
  typing(true);
  try {
    const d = await call();
    typing(false);
    if (d.step <= 2) {
      state.questions.push(d.question);
      addMsg(d.question, false);
      $("answer").value=""; $("answerBox").classList.remove("hidden"); $("chatErr").textContent="";
      $("answer").focus();
    } else {
      attemptsLeft = d.attemptsLeft;
      showResult(d);
    }
  } catch(e) {
    typing(false);
    $("answerBox").classList.remove("hidden");
    $("chatErr").textContent = e.message;
    if (e.status !== 429) $("answerBtn").onclick = () => { $("chatErr").textContent=""; $("answerBtn").onclick = sendAnswer; nextTurn(); };
  }
}

$("answerBtn").onclick = sendAnswer;
async function sendAnswer(){
  const a = $("answer").value.trim();
  if (a.length < 3) return $("chatErr").textContent = "اكتب إجابتك 🙂";
  state.answers.push(a);
  addMsg(a, true);
  await nextTurn();
}

function showResult(d){
  const r = d.result, ok = r.decision === "invest", H = CFG.hackathon, gate = CFG.modules.hackathon;
  const pct = r.score, th = r.qualifyScore;
  // بطاقة التأهل أو "قريب منها"
  if (d.ticket) {
    $("qualBox").innerHTML = `<div class="ticket">
      <div style="font-size:40px">🎟️</div>
      <h2 style="font-size:22px">مبروك! تأهلت إلى ${esc(H.name)}</h2>
      <p class="muted" style="font-size:14px">${d.emailed ? `أرسلناه أيضًا إلى ${esc(state.email)}. ` : "صوّره أو انسخه، فهو مفتاح تسجيلك."}</p>
      <div class="code">${esc(d.ticket)}</div>
      <p style="font-size:14px">سجّل فريقك وأكمل بياناتك في صفحة ${esc(H.name)}. فكرتك وملاحظات المستثمر بتنتقل معك.</p>
      <a class="btn" id="goHack" href="hackathon.html?ticket=${encodeURIComponent(d.ticket)}" style="display:block;text-decoration:none;margin-top:12px">أكمل التسجيل في ${esc(H.name)} ←</a>
    </div>`;
    try { localStorage.setItem("hack_import", JSON.stringify({
      ticket:d.ticket, dealId:d.dealId, name:state.name, email:state.email, idea:state.idea, title:r.title, investor:inv().name, decision:r.decision, amount:r.amount,
      verdict:r.verdict, strengths:r.strengths, weaknesses:r.weaknesses, tip:r.tip, score:r.score, at:Date.now() })); } catch(e){}
  } else if (gate && !r.qualified) {
    $("qualBox").innerHTML = `<div class="near"><b>ينقصك ${th - pct} درجة للتأهل إلى ${esc(H.name)}</b><br>
      <span class="muted" style="font-size:14px">${attemptsLeft > 0 ? `حسّن فكرتك حسب الملاحظات وجرّب مرة ثانية. باقي لك ${attemptsLeft} ${attemptsLeft===1?"محاولة":"محاولات"}.` : "استنفدت محاولاتك بهذا البريد."}${d.emailed ? `<br>✉️ أرسلنا نتيجتك وأهم ما تحسّنه إلى ${esc(state.email)}.` : ""}</span></div>`;
  } else $("qualBox").innerHTML = "";

  $("resultCard").innerHTML = `
    <span class="badge ${ok?"ok":"no"}">${ok ? "🎉 حصلت على استثمار!" : "🚪 المستثمر طلع"}</span>
    <div style="font-size:15px;color:var(--muted)">${esc(inv().emoji)} ${esc(inv().name)} عن «${esc(r.title)}»</div>
    ${ok ? `<div class="big">${fmt(r.amount)} ريال</div><div class="val">مقابل ${fmt(r.equity)}% · تقييم شركتك ${fmt(r.valuation)} ريال</div>` : `<div class="big">أنا خارج!</div>`}
    <p class="verdict">«${esc(r.verdict)}»</p>
    <div style="font-size:15px">درجة فكرتك: <b style="font-size:22px;color:var(--accent)">${pct}</b> / 100</div>
    <div class="thresh"><i id="scoreBar" style="width:0;background:${r.qualified?"var(--good)":"var(--accent)"}"></i>${gate?`<div class="mark" style="right:${th}%"><span style="${th>80?"transform:none;left:0":th<15?"transform:translateX(100%)":""}">حد التأهل ${th}</span></div>`:""}</div>
    <div style="margin-top:14px">${(r.criteria||[]).map(c=>`<div class="crit"><span>${esc(c.label)}</span><div class="bar"><i data-w="${(r.scores?.[c.key]||0)/c.max*100}%" style="width:0"></i></div><b>${r.scores?.[c.key]??0}/${c.max}</b></div>
      ${c.reason?`<div class="why">${c.capped?"🔒 ":""}${esc(c.reason)}${c.next?`<br><span class="nx">⬆️ ${esc(c.next)}</span>`:""}</div>`:""}`).join("")}</div>
    ${(r.capsApplied||[]).length?`<div class="caps"><b>🔒 قيود طُبّقت على الدرجة:</b> ${r.capsApplied.map(esc).join("، ")}</div>`:""}
    <div class="list"><h3>✅ نقاط القوة</h3><ul>${r.strengths.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    <div class="list"><h3>🔧 فرص التحسين</h3><ul>${r.weaknesses.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    <div class="tip">💡 <b>نصيحة المستثمر:</b> ${esc(r.tip)}</div>
    <div style="margin-top:14px;font-size:13px;color:var(--muted)">${esc(state.name)} · ${esc(CFG.brand.eventName)} · ${esc(CFG.brand.orgName)}</div>
    ${d.demo ? `<p class="demo" style="color:var(--bad);font-weight:700">⚠️ تقييم وهمي: الذكاء الاصطناعي غير مفعّل</p>` : ""}`;
  if (d.demo) $("qualBox").insertAdjacentHTML("afterbegin", `<div class="near" style="border:1.5px solid var(--bad);color:var(--text)"><b style="color:var(--bad)">⚠️ هذا تقييم وهمي عشوائي للعرض فقط</b><br><span style="font-size:14px">الذكاء الاصطناعي غير مفعّل، فالأسئلة ثابتة والدرجات عشوائية. فعّله من لوحة التحكم ← نظرة عامة.</span></div>`);
  $("againBtn").textContent = d.ticket ? "اعرض فكرة ثانية" : (attemptsLeft > 0 ? `جرّب مرة ثانية (${attemptsLeft} ${attemptsLeft===1?"محاولة":"محاولات"})` : "عرض فكرة ببريد آخر");
  show("s-result");
  setTimeout(()=>{ $("scoreBar").style.width = r.score+"%"; document.querySelectorAll("#resultCard .bar i").forEach(i=>i.style.width=i.dataset.w); }, 100);
}
$("againBtn").onclick = () => { if (attemptsLeft === 0) $("email").value = ""; $("idea").value = attemptsLeft > 0 && !$("qualBox").querySelector(".ticket") ? state.idea : ""; $("idea").oninput(); show("s-start"); };
</script>
</body>
</html>
