<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة البيانات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
html,body{height:100%;overflow:hidden}
.g{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto 1fr 1fr;gap:1.2vw;height:100vh;padding:1.5vw 1.5vw 3.4vw}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:2.6vw}
[data-logo] img{max-height:3.4vw;max-width:14vw}
.brandrow{display:flex;align-items:center;gap:1.2vw}
.sub{color:var(--muted);font-size:1.1vw}
.clock{font-size:1.6vw;color:var(--muted);font-variant-numeric:tabular-nums}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:1vw}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:1vw;padding:1vw;text-align:center}
.kpi b{display:block;font-size:3vw;line-height:1.2;color:var(--text);font-variant-numeric:tabular-nums}
.kpi span{font-size:1vw;color:var(--muted)}
.kpi.hl b{color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:1.2vw;padding:1.2vw;display:flex;flex-direction:column;min-height:0}
.panel h2{font-size:1.25vw;color:var(--muted);font-weight:500;margin-bottom:.6vw}
.panel svg{flex:1;width:100%;min-height:0}
.ev{display:flex;flex-direction:column;gap:.5vw;overflow:hidden}
.ev div{display:flex;gap:.8vw;align-items:center;background:var(--card2);border-radius:.7vw;padding:.55vw .8vw;font-size:1.05vw;animation:pop .5s ease}
.ev .k{font-size:1.4vw;color:var(--accent)}
.ev .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .s{font-weight:700;color:var(--accent)}
.span2{grid-column:span 2}
.tip{position:fixed;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:.5vw;padding:.4vw .7vw;font-size:1vw;display:none;z-index:9}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="dark" data-screen>
<div class="g">
  <header>
    <div class="brandrow"><div data-logo hidden></div><div><h1><i data-icon="chart-column"></i> <span id="title"></span></h1><div class="sub"><span data-text="brand.boothName"></span> · <span data-text="brand.eventName"></span></div></div></div>
    <div class="clock" id="clock"></div>
  </header>
  <div class="kpis" id="kpis"></div>
  <section class="panel span2"><h2>النشاط في آخر 12 ساعة (عروض أفكار وتقديمات مشاريع)</h2><svg id="hP" preserveAspectRatio="none"></svg></section>
  <section class="panel"><h2><i data-icon="zap"></i> آخر النشاط</h2><div class="ev" id="ev"></div></section>
  <section class="panel"><h2>الفرق حسب المسار</h2><svg id="tr" preserveAspectRatio="none"></svg></section>
  <section class="panel"><h2>توزيع درجات الأفكار (<span data-text="investor.title"></span>)</h2><svg id="dP" preserveAspectRatio="none"></svg></section>
  <section class="panel"><h2>توزيع درجات مشاريع <span data-text="hackathon.name">التحدي</span></h2><svg id="dH" preserveAspectRatio="none"></svg></section>
</div>
<div class="tip" id="tip"></div>
<div data-ticker hidden></div>
<script>
const $ = id => document.getElementById(id), esc = APP.esc, fmt = APP.fmt;
const NS = "http://www.w3.org/2000/svg";
const css = getComputedStyle(document.documentElement);
const tip = $("tip");
function hover(el, text){
  el.addEventListener("mousemove", e => { tip.style.display="block"; tip.textContent = text; tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY+12)+"px"; });
  el.addEventListener("mouseleave", () => tip.style.display="none");
}
// أعمدة رأسية بلون واحد: أطراف دائرية 4px، فجوة 2px، خط أساس، تسميات بلون النص
function vbars(svg, items){
  const r = svg.getBoundingClientRect(), W = r.width, H = r.height;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = "";
  const pad = {t: 18, b: 24}, n = items.length, max = Math.max(1, ...items.map(i=>i.v));
  const bw = (W / n) - 2, accent = css.getPropertyValue("--accent").trim() || "#f5b83d";
  const base = H - pad.b;
  svg.insertAdjacentHTML("beforeend", `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1"/>`);
  items.forEach((it, i) => {
    const h = (it.v / max) * (base - pad.t), x = W - (i+1)*(bw+2);   // من اليمين لليسار
    if (it.v > 0) {
      const rad = Math.min(4, bw/2, h);
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", `M${x},${base} V${base-h+rad} Q${x},${base-h} ${x+rad},${base-h} H${x+bw-rad} Q${x+bw},${base-h} ${x+bw},${base-h+rad} V${base} Z`);
      p.style.fill = "var(--accent)"; svg.appendChild(p); hover(p, `${it.label}: ${fmt(it.v)}`);
      if (it.v === max || n <= 6) svg.insertAdjacentHTML("beforeend", `<text x="${x+bw/2}" y="${base-h-5}" text-anchor="middle" style="fill:var(--text)" font-size="${Math.max(11, W/70)}">${fmt(it.v)}</text>`);
    }
    svg.insertAdjacentHTML("beforeend", `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" style="fill:var(--muted)" font-size="${Math.max(10, W/80)}">${esc(it.label)}</text>`);
  });
}
// أعمدة أفقية للمسارات
function hbars(svg, items){
  const r = svg.getBoundingClientRect(), W = r.width, H = r.height;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = "";
  const n = Math.max(1, items.length), rowH = Math.min(44, H / n), bh = rowH * 0.5, max = Math.max(1, ...items.map(i=>i.v));
  const labelW = W * 0.42, accent = css.getPropertyValue("--accent").trim() || "#f5b83d", fs = Math.max(11, W/28);
  items.forEach((it, i) => {
    const y = i * rowH + (rowH - bh) / 2, w = (it.v / max) * (W - labelW - 40);
    const maxCh = Math.max(4, Math.floor((labelW - 12) / (fs * 0.55)));
    const lbl = it.label.length > maxCh ? it.label.slice(0, maxCh - 1) + "…" : it.label;
    svg.insertAdjacentHTML("beforeend", `<text x="${W}" y="${y+bh*0.8}" style="fill:var(--text)" font-size="${fs}"><title>${esc(it.label)}</title>${esc(lbl)}</text>`);
    const x0 = W - labelW;
    if (w > 0) {
      const p = document.createElementNS(NS, "path"), rad = Math.min(4, bh/2, w);
      p.setAttribute("d", `M${x0},${y} H${x0-w+rad} Q${x0-w},${y} ${x0-w},${y+rad} V${y+bh-rad} Q${x0-w},${y+bh} ${x0-w+rad},${y+bh} H${x0} Z`);
      p.style.fill = "var(--accent)"; svg.appendChild(p); hover(p, `${it.label}: ${fmt(it.v)} فريق`);
    }
    svg.insertAdjacentHTML("beforeend", `<text x="${x0-w-6}" y="${y+bh*0.8}" direction="ltr" text-anchor="end" style="fill:var(--text)" font-size="${fs}" font-weight="700">${fmt(it.v)}</text>`);
  });
}
const BUCKETS = ["0–19","20–39","40–59","60–79","80–100"];
let last = null;
function draw(d){
  last = d;
  const k = d.kpi;
  $("kpis").innerHTML = [[k.pitches,"فكرة عُرضت",1],[k.qualified,"متأهل",1],[k.qualifyRate+"%","نسبة التأهل"],[k.teams,"فريق"],[k.submissions,"تقديم"],[k.avgScore,"متوسط درجات المشاريع"]]
    .map(([v,l,hl])=>`<div class="kpi ${hl?"hl":""}"><b>${typeof v==="number"?fmt(v):v}</b><span>${l}</span></div>`).join("");
  vbars($("hP"), d.hours.map(h=>({label: new Date(h.h).toLocaleTimeString("ar-SA-u-nu-latn",{hour:"numeric"}), v: h.pitches + h.subs})));
  hbars($("tr"), d.tracks.map(t=>({label:t.title, v:t.teams})));
  vbars($("dP"), d.pitchHist.map((v,i)=>({label:BUCKETS[i], v})));
  vbars($("dH"), d.projHist.map((v,i)=>({label:BUCKETS[i], v})));
  const KIND = {pitch:["lightbulb","عرض فكرة"], qualified:["ticket","تأهل"], team:["users","فريق جديد"], eval:["zap","تقييم مشروع"]};
  $("ev").innerHTML = d.events.length ? d.events.map(e=>`<div><span class="k">${glyph(KIND[e.kind][0])}</span><span class="t"><b>${esc(e.name)}</b> · ${KIND[e.kind][1]}${e.title?` · ${esc(e.title)}`:""}</span>${e.score!=null?`<span class="s">${e.score}</span>`:""}</div>`).join("") : `<p class="muted">بانتظار أول نشاط…</p>`;
}
async function load(){ try { draw(await (await fetch("api/feed?scope=dashboard",{cache:"no-store"})).json()); } catch(e){ console.warn(e); } }
APP.ready.then(c => { $("title").innerHTML = APP.title("لوحة " + (c.brand.eventName || "البيانات")); document.title = "لوحة البيانات"; load(); });
setInterval(load, 10000); setInterval(()=>APP.refreshConfig(), 30000);
addEventListener("resize", () => last && draw(last));
const clock = () => $("clock").textContent = new Date().toLocaleTimeString("ar-SA-u-nu-latn",{hour:"numeric",minute:"2-digit"});
clock(); setInterval(clock, 20000);
</script>
</body>
</html>
