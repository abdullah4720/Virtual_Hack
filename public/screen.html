<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة الأفكار</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="qrcode.min.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--paper);color:var(--text);overflow:hidden}
.grid{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;grid-template-rows:auto 1fr;gap:1.4vw;height:100vh;padding:1.6vw}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:2vw}
h1{font-size:2.4vw;font-weight:700;line-height:1.3}
h1 .lu{width:.85em;height:.85em}
h1 span{color:var(--accent)}
.stats{display:flex;gap:1.2vw}
.stat{background:var(--card);border:1px solid var(--line);border-radius:1vw;padding:.8vw 1.4vw;text-align:center;min-width:10vw}
.stat b{display:block;font-size:2.2vw;color:var(--accent)}
.stat small{color:var(--muted);font-size:1vw}
.panel{background:var(--card);border:1px solid var(--line);border-radius:1.2vw;padding:1.4vw;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panel h2{font-size:1.5vw;margin-bottom:1vw;color:var(--muted);font-weight:500}
.rows{display:flex;flex-direction:column;gap:.7vw;overflow:hidden}
.row{display:flex;align-items:center;gap:1vw;background:var(--card2);border-radius:.8vw;padding:.8vw 1vw;animation:pop .5s ease}
.rank{font-size:1.6vw;font-weight:700;width:2.4vw;text-align:center;color:var(--muted)}
.row:nth-child(1) .rank{color:#ffd166}.row:nth-child(2) .rank{color:#d7dce8}.row:nth-child(3) .rank{color:#e3a36f}
.who{flex:1;min-width:0}
.who b{display:block;font-size:1.25vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:.95vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.money{font-size:1.25vw;font-weight:700;color:var(--accent);white-space:nowrap}
.money,.amt>span,.amt{unicode-bidi:isolate}
.money small,.amt small{font-size:.6em;color:var(--muted);font-weight:500}
.money.dim,.amt.dim{color:var(--muted)}
.out{color:var(--bad);font-size:1.1vw;font-weight:700}
.spot{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:1vw}
.spot .tag{align-self:center;font-size:1.1vw;padding:.4vw 1.2vw;border-radius:99px;font-weight:700}
.tag.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.tag.no{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.spot .name{font-size:2.6vw;font-weight:700}
.spot .idea{font-size:1.5vw;color:var(--muted)}
.spot .amt{font-size:3.6vw;font-weight:700;color:var(--accent);line-height:1.2}
.spot .quote{font-size:1.7vw;line-height:1.7;padding:0 1vw}
.spot .by{color:var(--muted);font-size:1.1vw}
.qr{align-items:center;text-align:center;justify-content:safe center;gap:min(1.2vw,2vh)}
.qr .box{background:#fff;padding:1vw;border-radius:1vw}
.qr .box img,.qr .box canvas{width:min(17vw,30vh)!important;height:min(17vw,30vh)!important;display:block}
.qr h3{font-size:min(2vw,3.6vh);line-height:1.5}
.qr p{color:var(--muted);font-size:1.2vw;line-height:1.7}
/* عند ظهور العدّ التنازلي يصغر الرمز قليلًا ليتسع كل شيء */
.qr:has(#cd:not([hidden])) .box img,.qr:has(#cd:not([hidden])) .box canvas{width:min(14vw,21vh)!important;height:min(14vw,21vh)!important}
.qr:has(#cd:not([hidden])) h3{font-size:min(1.8vw,3.1vh)}
.qr:has(#cd:not([hidden])) .steps{line-height:1.65}
.steps{text-align:right;font-size:min(1.35vw,2.4vh);font-weight:700;line-height:1.85;color:var(--text)}
.empty{color:var(--muted);font-size:1.2vw;text-align:center;margin-top:2vw}
.flash{animation:flash 1.6s ease}
/* ===== لحظة ظهور فكرة جديدة ===== */
body.fx .spot.enter>*{animation:spotIn .7s cubic-bezier(.2,.8,.2,1) both}
body.fx .spot.enter>*:nth-child(2){animation-delay:.12s}body.fx .spot.enter>*:nth-child(3){animation-delay:.22s}
body.fx .spot.enter>*:nth-child(4){animation-delay:.32s}body.fx .spot.enter>*:nth-child(5){animation-delay:.42s}body.fx .spot.enter>*:nth-child(6){animation-delay:.52s}
@keyframes spotIn{from{opacity:0;transform:translateY(1.2vw) scale(.96)}to{opacity:1;transform:none}}
body.fx .tag.cheer{animation:cheer 1.2s ease-in-out 3}
@keyframes cheer{50%{transform:scale(1.12);box-shadow:0 0 1.4vw color-mix(in srgb,var(--good) 55%,transparent)}}
/* ===== العرض التعريفي عند الهدوء ===== */
.grid>.panel{grid-row:2}
.attract{grid-column:1/3;position:relative}
.attract[hidden],.grid.idle>.board{display:none}
.att-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:min(1.4vw,2.4vh)}
.att-head h2{margin:0;font-size:min(1.9vw,3.4vh);color:var(--text);font-weight:700}
.att-head h2 i{color:var(--accent)}
.att-dots{display:flex;gap:.5vw}.att-dots i{width:.7vw;height:.7vw;border-radius:50%;background:var(--line)}.att-dots i.on{background:var(--accent)}
.att-body{flex:1;min-height:0;display:grid;gap:min(1.2vw,2vh)}
.att-bar{position:absolute;inset-inline:0;bottom:0;height:4px;background:transparent}
.att-bar i{display:block;height:100%;background:var(--accent);width:0}
body.fx .att-bar i.run{animation:attBar linear forwards}
@keyframes attBar{to{width:100%}}
.att-card{background:var(--card2);border-radius:1vw;padding:min(1.4vw,2.4vh);display:flex;flex-direction:column;gap:min(.7vw,1.2vh);min-height:0;overflow:hidden}
body.fx .att-card{animation:spotIn .7s cubic-bezier(.2,.8,.2,1) both}
.att-card .ic{width:min(4vw,7vh);height:min(4vw,7vh);border-radius:1vw;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-size:min(2.2vw,3.8vh);flex:none}
.att-card b{font-size:min(1.6vw,2.8vh);line-height:1.4}
.att-card p{color:var(--muted);font-size:min(1.15vw,2vh);line-height:1.75}
.att-tracks{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.att-steps{display:flex;align-items:center}
.proc{position:relative;display:grid;grid-template-columns:repeat(4,1fr);width:100%;--dot:min(6.4vw,11vh)}
.proc-line{position:absolute;top:calc(var(--dot)/2 - 2px);inset-inline:12.5%;height:4px;border-radius:4px;background:var(--line)}
.proc-line i{position:absolute;inset:0;border-radius:inherit;background:var(--accent);transform-origin:right}
body.fx .proc-line i{animation:procFill 2.4s linear .3s both}
@keyframes procFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.proc-step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:min(.7vw,1.2vh);padding:0 min(.8vw,1.4vh)}
.proc-step .dot{position:relative;width:var(--dot);height:var(--dot);border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink,#fff);font-size:min(2.6vw,4.6vh);box-shadow:0 0 0 min(.5vw,.9vh) var(--card),0 0 0 min(.65vw,1.15vh) color-mix(in srgb,var(--accent) 45%,transparent)}
.proc-step .n{position:absolute;top:-.3vw;inset-inline-end:-.3vw;width:min(2vw,3.5vh);height:min(2vw,3.5vh);border-radius:50%;display:grid;place-items:center;background:#ffd166;color:#1a1a1a;font-size:min(1.05vw,1.85vh);font-weight:700}
.proc-step b{font-size:min(1.4vw,2.5vh);line-height:1.45;margin-top:min(.6vw,1vh)}
.proc-step p{color:var(--muted);font-size:min(1.05vw,1.85vh);line-height:1.7}
body.fx .proc-step .dot{animation:procDot .6s cubic-bezier(.2,.8,.2,1) var(--d) both}
body.fx .proc-step b,body.fx .proc-step p{animation:spotIn .6s ease var(--d) both}
@keyframes procDot{from{background:var(--card2);color:var(--muted);transform:scale(.8)}60%{transform:scale(1.12)}to{transform:none}}
.att-top{display:flex;justify-content:center;align-items:flex-end}
.att-top .att-card{width:31%}
.att-top .att-card{align-items:center;text-align:center;justify-content:center}
.att-top .att-card:nth-child(1){min-height:92%;border:2px solid #ffd166}.att-top .att-card:nth-child(2){min-height:78%}.att-top .att-card:nth-child(3){min-height:68%}
.att-top .medal{font-size:min(3.6vw,6vh);font-weight:700}
.att-top .att-card:nth-child(1) .medal{color:#ffd166}.att-top .att-card:nth-child(2) .medal{color:#d7dce8}.att-top .att-card:nth-child(3) .medal{color:#e3a36f}
.att-top .money{font-size:min(1.8vw,3.2vh)}
.att-stats{grid-template-columns:repeat(3,1fr);align-content:center}
.att-stats .att-card{align-items:center;justify-content:center;text-align:center;height:min(20vw,38vh)}
.att-stats .big{font-size:min(3.8vw,7vh);font-weight:700;color:var(--accent);line-height:1.1}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 2vw transparent}}
[data-logo] img{max-height:3.6vw;max-width:14vw;display:block}
.brandrow{display:flex;align-items:center;gap:2.2vw}
.brandrow [data-logo]:not([hidden]){padding-inline-end:2.2vw;border-inline-end:1px solid rgba(255,255,255,.18)}
.sub2{margin-top:.3vw}
.sub2{color:var(--muted);font-size:1.15vw}
.gold{color:var(--accent)}
h1 span[data-title]{color:var(--text)}
h1 span[data-title] .gold{color:var(--accent)}
[data-ticker]{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--accent) 20%,var(--paper));border-top:2px solid var(--accent);color:var(--text);overflow:hidden;white-space:nowrap;z-index:5;font-size:1.4vw;padding:.6vw 0}
[data-ticker] .tk-in{display:inline-flex;width:max-content;animation:tk 30s linear infinite}
[data-ticker] .tk-c{display:inline-flex;flex:none}
[data-ticker] .tk-c span{margin-left:4vw}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(50%)}}
</style>
</head>
<body class="dark" data-screen>
<div class="grid">
  <header>
    <div class="brandrow"><div data-logo hidden></div><div><h1><i data-icon="briefcase-business"></i> <span data-title="investor.title">&nbsp;</span></h1><div class="sub2"><span data-text="brand.boothName"></span> · <span data-text="brand.eventName"></span></div></div></div>
    <div class="stats">
      <div class="stat"><b id="sPitches">0</b><small>عرض</small></div>
      <div class="stat"><b id="sDeals">0</b><small>متأهل</small></div>
      <div class="stat"><b id="sTotal">0</b><small>متوسط الدرجات</small></div>
    </div>
  </header>

  <section class="panel board">
    <h2><i data-icon="trophy"></i> أعلى التقييمات</h2>
    <div class="rows" id="top" data-fit></div>
  </section>

  <section class="panel board" id="spotPanel">
    <h2><i data-icon="zap"></i> آخر عرض</h2>
    <div class="spot" id="spot"><p class="empty">بانتظار أول عرض… كن أنت الأول.</p></div>
    <h2 style="margin-top:1vw">آخر العروض</h2>
    <div class="rows" id="recent" data-fit></div>
  </section>

  <section class="panel attract" id="attract" hidden>
    <div class="att-head"><h2 id="attTitle"></h2><div class="att-dots" id="attDots"></div></div>
    <div class="att-body" id="attBody"></div>
    <div class="att-bar"><i id="attBar"></i></div>
  </section>

  <section class="panel qr">
    <h3>لديك فكرة؟<br>اختبرها الآن مع مستشار ذكي</h3>
    <div class="box fx-qr" id="qr"></div>
    <div class="cd" id="cd" hidden></div>
    <div class="steps">
      ١. امسح الرمز بجوالك<br>
      ٢. اختر «<span data-text="investor.title"></span>» واكتب فكرتك<br>
      ٣. أجب عن سؤالين<br>
      ٤. احصل على تقييمك وتأهّل
    </div>
  </section>
</div>

<script>
let INV = {}, CFG = null, FEED = null;
APP.ready.then(c => { CFG = c; INV = Object.fromEntries(c.investor.investors.map(i => [i.id, `${glyph(i.emoji)} ${APP.esc(i.name)}`])); document.title = c.investor.title; });
const $ = id => document.getElementById(id);
const fmt = n => Number(n||0).toLocaleString("ar-SA-u-nu-latn");
const esc = s => { const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; };
const short = n => n>=1e6 ? (n/1e6).toLocaleString("ar-SA-u-nu-latn",{maximumFractionDigits:1})+" مليون" : fmt(n);

// رمز QR موحد يقود إلى صفحة الترحيب (يمكن تغييره بإضافة ?url=...)
const visitorUrl = new URLSearchParams(location.search).get("url") || (location.protocol === "file:" ? new URL("welcome.html", location.href) : new URL("welcome", location.href)).href;
try { new QRCode($("qr"), {text: visitorUrl, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M}); }
catch(e){ $("qr").textContent = visitorUrl; }

let lastId = null;
async function refresh(){
  try {
    const d = await fetch("api/feed", {cache:"no-store"}).then(r=>r.json());
    FEED = d;
    APP.count($("sPitches"), d.stats.pitches);
    APP.count($("sDeals"), d.stats.qualified ?? d.stats.deals);
    APP.count($("sTotal"), d.stats.avgScore);

    APP.setHTML($("top"), d.top.length ? d.top.map((x,i)=>`
      <div class="row"><span class="rank">${i+1}</span>
        <div class="who"><b>${esc(x.name)}</b><small>${esc(x.title)}</small></div>
        <span class="money" dir="ltr">${x.score}<small>/100</small></span></div>`).join("")
      : `<p class="empty">لا يوجد متأهلون بعد… كن أنت الأول.</p>`);

    APP.setHTML($("recent"), d.recent.slice(1,5).map(x=>`
      <div class="row"><div class="who"><b>${esc(x.name)} · ${esc(x.title)}</b><small>${INV[x.investor]||""}</small></div>
      ${x.qualified ? `<span class="money" dir="ltr">${x.score}<small>/100</small></span>` : `<span class="out">غير متأهل</span>`}</div>`).join(""));

    APP.fit($("top")); APP.fit($("recent"));
    const latest = d.recent[0];
    if (latest) {
      const key = latest.id ?? latest.created_at;
      if (key !== lastId) {
        const ok = latest.decision === "invest", fresh = lastId !== null;
        $("spot").innerHTML = `
          <span class="tag ${ok?"ok":"no"} ${fresh&&latest.qualified?"cheer":""}">${latest.qualified?(fresh?'<i data-icon="party-popper"></i> مبروك التأهّل!':'<i data-icon="ticket"></i> تأهّل'):ok?"متأهل":"غير متأهل"}</span>
          <div class="name">${esc(latest.name)}</div>
          <div class="idea">«${esc(latest.title)}»</div>
          ${ok ? `<div class="amt" dir="ltr"><span id="amtV">${latest.score}</span><small> / 100</small></div>
          <div class="by">درجة الفكرة · حد التأهل ${CFG?.investor?.qualifyScore ?? 60}</div>` : ""}
          <div class="quote">“${esc(latest.verdict)}”</div>
          <div class="by">— ${INV[latest.investor]||""}</div>`;
        if (lastId === null) lastAct = Date.parse(latest.created_at) || 0;
        if (fresh) {
          // مشاركة جديدة: تخرج الشاشة من العرض التعريفي وتحتفي بصاحبها
          lastAct = Date.now(); setIdle(false);
          $("spot").classList.remove("enter"); void $("spot").offsetWidth; $("spot").classList.add("enter");
          if (ok) { const v = $("amtV"); v.textContent = "0"; v._v = undefined; APP.count(v, latest.score, fmt, 1600); }
          $("spotPanel").classList.remove("flash"); void $("spotPanel").offsetWidth; $("spotPanel").classList.add("flash");
          if (latest.qualified) setTimeout(() => APP.confetti(), 500);
        }
        lastId = key;
      }
    } else if (lastId !== "empty") {
      // لا توجد عروض (بعد الحذف مثلًا): تُفرغ البطاقة فلا يبقى اسم محذوف
      $("spot").innerHTML = `<p class="empty">بانتظار أول عرض… كن أنت الأول.</p>`; lastId = "empty"; lastAct = 0;
    }
    checkIdle();
  } catch(e) { console.warn(e); }
}

// ===== العرض التعريفي: إذا مرّت مدة بلا مشاركة جديدة تتناوب الشاشة على شرائح تعريفية ثم الترتيب =====
let lastAct = 0, idle = false, slideI = -1, slideT = null;
const idleMs = () => (CFG?.booth?.idleMinutes ?? 3) * 60000;
function checkIdle(){
  if (!CFG) return;
  const want = idleMs() > 0 && Date.now() - lastAct > idleMs();
  if (want && !idle) { idle = true; slideI = -1; nextSlide(); }
  else if (!want && idle) setIdle(false);
}
function setIdle(on){
  idle = on; clearTimeout(slideT);
  if (!on) { $("attract").hidden = true; document.querySelector(".grid").classList.remove("idle"); requestAnimationFrame(() => { APP.fit($("top")); APP.fit($("recent")); }); }
}
function slides(){
  const c = CFG, d = FEED || {stats:{}, top:[]}, out = [];
  const tracks = c?.hackathon?.tracks || [];
  if (tracks.length) out.push({ t: `<i data-icon="compass"></i> المسارات`, cls: "att-tracks", h: tracks.slice(0,4).map((x,i)=>`
    <div class="att-card" style="animation-delay:${i*.15}s;${x.color?`border-top:4px solid ${APP.esc(x.color)}`:""}"><span class="ic" style="${x.color?`color:${APP.esc(x.color)};background:color-mix(in srgb,${APP.esc(x.color)} 18%,transparent)`:""}"><i data-icon="${APP.esc(x.icon||"lightbulb")}"></i></span><b>${esc(x.title)}</b><p>${esc(x.desc||"")}</p></div>`).join("") });
  const steps = [["qr-code","امسح الرمز بجوالك","رمز QR بجوار الشاشة"],["lightbulb",`اختر «${esc(c?.investor?.title||"")}» واكتب فكرتك`,"المشكلة والحل باختصار"],["message-square","أجب عن سؤالين","يطرحهما المستشار الذكي عن فكرتك"],["award","احصل على تقييمك وتأهّل","تقييم فوري ونتيجتك مباشرة"]];
  out.push({ t: `<i data-icon="list-ordered"></i> كيف تشارك؟`, cls: "att-steps", h: `<div class="proc"><div class="proc-line"><i></i></div>${steps.map(([ic,x,sub],i)=>`
    <div class="proc-step" style="--d:${(.3+i*.8).toFixed(1)}s"><span class="dot"><i data-icon="${ic}"></i><span class="n">${i+1}</span></span><b>${x}</b><p>${sub}</p></div>`).join("")}</div>` });
  const top = (d.top||[]).slice(0,3);
  if (top.length) out.push({ t: `<i data-icon="trophy"></i> أعلى الأفكار تقييمًا`, cls: "att-top", h: top.map((x,i)=>`
    <div class="att-card" style="animation-delay:${i*.2}s"><span class="medal">${i+1}</span><b>${esc(x.name)}</b><p>«${esc(x.title)}»</p><span class="money" dir="ltr">${x.score}<small>/100</small></span></div>`).join("") });
  if (d.stats.pitches) out.push({ t: `<i data-icon="chart-column"></i> الفعالية بالأرقام`, cls: "att-stats", h: [["pitches","فكرة عُرضت"],["qualified","متأهل"],["avgScore","متوسط الدرجات"]].map(([k,l],i)=>`
    <div class="att-card" style="animation-delay:${i*.2}s"><span class="big" data-n="${k}">0</span><p>${l}</p></div>`).join(""), after: el => el.querySelectorAll("[data-n]").forEach(n => { const v = n.dataset.n==="qualified" ? (d.stats.qualified ?? d.stats.deals) : d.stats[n.dataset.n]; n._v = undefined; n.textContent = "0"; APP.count(n, v, n.dataset.n==="total" ? short : fmt, 1800); }) });
  out.push({ board: true });
  return out;
}
function nextSlide(){
  if (!idle) return;
  const S = slides(); slideI = (slideI + 1) % S.length; const sl = S[slideI];
  const grid = document.querySelector(".grid");
  if (sl.board) { $("attract").hidden = true; grid.classList.remove("idle"); requestAnimationFrame(() => { APP.fit($("top")); APP.fit($("recent")); }); slideT = setTimeout(nextSlide, 15000); return; }
  $("attTitle").innerHTML = sl.t;
  $("attDots").innerHTML = S.filter(x=>!x.board).map((_,i)=>`<i class="${i===slideI?"on":""}"></i>`).join("");
  $("attBody").className = "att-body " + sl.cls; $("attBody").innerHTML = sl.h;
  grid.classList.add("idle"); $("attract").hidden = false;
  if (sl.after) sl.after($("attBody"));
  const bar = $("attBar"); bar.classList.remove("run"); void bar.offsetWidth; bar.style.animationDuration = "12s"; bar.classList.add("run");
  slideT = setTimeout(nextSlide, 12000);
}

refresh();
setInterval(refresh, 4000);
// العدّ التنازلي لإقفال التسجيل (يظهر فقط إذا حُدّد موعد الإقفال في إعدادات التحدي)
const tickCd = () => { if (CFG && CFG.modules?.hackathon) APP.countdown($("cd"), CFG.hackathon, null, "التسجيل", true); };
setInterval(tickCd, 1000); APP.ready.then(tickCd);
setInterval(async () => { const c = await APP.refreshConfig(); if (c) CFG = c; }, 30000);
</script>
<div data-ticker hidden></div>
</body>
