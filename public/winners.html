<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعلان الفائزين</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
html,body{height:100%;overflow:hidden}
.stage{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw;gap:1.5vw}
.kicker{font-size:1.6vw;color:var(--muted)}
.title{font-size:5vw;font-weight:700;line-height:1.3}
.place{font-size:2.4vw;font-weight:700;padding:.4vw 2vw;border-radius:99px;background:var(--soft)}
.p1{color:#ffd166}.p2{color:#d7dce8}.p3{color:#e3a36f}
.medal{font-size:9vw;line-height:1;animation:drop .9s cubic-bezier(.2,1.4,.4,1)}
.team{font-size:5.4vw;font-weight:700;line-height:1.25;animation:rise .8s ease .25s both}
.proj{font-size:2.2vw;color:var(--muted);animation:rise .8s ease .45s both}
.mem{font-size:1.6vw;animation:rise .8s ease .6s both}
.score{font-size:1.5vw;color:var(--muted);animation:rise .8s ease .75s both}
.score b{color:var(--accent);font-size:2.2vw}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:2vw;align-items:end;width:min(90vw,1300px)}
.pc{background:var(--card);border:1px solid var(--line);border-radius:1.4vw;padding:2vw 1.4vw}
.pc .m{font-size:5vw}
.pc b{display:block;font-size:2.2vw;line-height:1.3}
.pc span{display:block;color:var(--muted);font-size:1.3vw}
.pc.first{padding-top:3.2vw;border-color:var(--gold)}
.hint{position:fixed;bottom:1.5vw;left:50%;transform:translateX(-50%);color:var(--muted);font-size:1vw}
.warn{position:fixed;top:1vw;left:50%;transform:translateX(-50%);font-size:1vw}
canvas{position:fixed;inset:0;pointer-events:none}
.login{max-width:420px;margin:14vh auto;text-align:right}
@keyframes drop{from{transform:translateY(-40vh) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(3vw);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body class="dark" data-noannounce>
<div id="loginView" class="card login hidden">
  <h1 style="font-size:24px">شاشة إعلان الفائزين</h1>
  <label for="k">مفتاح اللجنة</label>
  <input id="k" type="password" dir="ltr">
  <button class="btn" id="go" style="margin-top:14px">فتح الشاشة</button>
  <p class="err" id="err"></p>
</div>
<div id="stage" class="stage hidden"></div>
<div class="hint" id="hint"></div>
<span class="pill no warn hidden" id="warn"></span>
<canvas id="fx"></canvas>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; };
let KEY; try { KEY = sessionStorage.getItem("jk"); } catch(e){}
let F = [], step = 0, C = null, BY_TRACK = true;
const MEDAL = [1,2,3].map(n=>`<i data-icon="medal" class="medal-${n}"></i>`), PLACE = ["المركز الأول","المركز الثاني","المركز الثالث"];

async function load(){
  const r = await fetch("api/hack?action=results",{headers:{"x-judge-key":KEY}});
  const d = await r.json(); if (!r.ok) throw new Error(d.error||"خطأ");
  F = d.finalists; C = d.config; BY_TRACK = (d.awards || "track") === "track";
  // الفوز حسب المسار: فائز واحد لكل مسار، بترتيب المسارات في الإعدادات
  if (BY_TRACK) { const order = C.hackathon.tracks.map(t => t.id); F = F.filter(f => f.award === 1).sort((a, b) => order.indexOf(a.track) - order.indexOf(b.track)); }
  document.title = "إعلان الفائزين · " + C.hackathon.name;
  $("loginView").classList.add("hidden"); $("stage").classList.remove("hidden");
  $("hint").textContent = "اضغط مسافة أو انقر للانتقال ←";
  const pending = (BY_TRACK ? F : F.slice(0,3)).filter(f=>f.pending).length;
  if (pending) { $("warn").textContent = `تنبيه للمنظّم: ${pending} من ${BY_TRACK ? "الفائزين" : "الثلاثة الأوائل"} بلا درجات لجنة بعد، والترتيب الحالي مبني على تقييم الذكاء الاصطناعي فقط`; $("warn").classList.remove("hidden"); }
  render();
}
$("go").onclick = async () => { KEY=$("k").value.trim(); try{ await load(); try{sessionStorage.setItem("jk",KEY)}catch(e){} }catch(e){ $("err").textContent=e.message; } };

// التسلسل: مقدمة → الثالث → الثاني → الأول → منصة التتويج
function render(){
  if (BY_TRACK) return renderTracks();
  const s = $("stage"), n = Math.min(3, F.length);
  if (!F.length) { s.innerHTML = `<div class="title">لا توجد مشاريع متأهلة بعد</div>`; return; }
  if (step === 0) {
    s.innerHTML = `<div style="display:flex;gap:3vw;align-items:center;justify-content:center">${(C.brand.logos||[]).map(l=>`<img src="${esc(l.url)}" alt="" class="${l.mono?"mono":""}" style="max-height:7vw;max-width:24vw">`).join("")}</div>
      <div class="kicker">${esc([C.brand.boothName, C.brand.eventName].filter(Boolean).join(" · "))}</div>
      <div class="title"><i data-icon="zap"></i> ${APP.title(C.hackathon.name)}</div>
      <div class="place">إعلان الفائزين</div>`;
    return;
  }
  if (step <= n) {
    const i = n - step, f = F[i];
    s.innerHTML = `<div class="place p${i+1}">${PLACE[i]}</div>
      <div class="medal">${MEDAL[i]}</div>
      <div class="team">${esc(f.team)}</div>
      <div class="proj">«${esc(f.title)}» · ${esc(f.challenge)}</div>
      <div class="mem">${esc((f.members||[]).join(" · "))}</div>
      <div class="score">الدرجة النهائية <b>${f.final}</b></div>`;
    if (i === 0) confetti();
    return;
  }
  const order = [1,0,2].filter(i=>i<n);
  s.innerHTML = `<div class="title" style="font-size:3.4vw"><i data-icon="trophy"></i> الفائزون في ${esc(C.hackathon.name)}</div>
    <div class="podium">${order.map(i=>`<div class="pc ${i===0?"first":""}"><div class="m">${MEDAL[i]}</div><b>${esc(F[i].team)}</b><span>${esc(F[i].title)}</span><span class="gold" style="margin-top:.5vw">${F[i].final}</span></div>`).join("")}</div>
    <div class="kicker">شكرًا لجميع الفرق المشاركة</div>`;
  $("hint").textContent = "";
}
// التسلسل حسب المسار: مقدمة ← فائز كل مسار ← لوحة الفائزين
function renderTracks(){
  const s = $("stage"), n = F.length;
  if (!n) { s.innerHTML = `<div class="title">لا توجد مشاريع متأهلة بعد</div>`; return; }
  if (step === 0) {
    s.innerHTML = `<div style="display:flex;gap:3vw;align-items:center;justify-content:center">${(C.brand.logos||[]).map(l=>`<img src="${esc(l.url)}" alt="" class="${l.mono?"mono":""}" style="max-height:7vw;max-width:24vw">`).join("")}</div>
      <div class="kicker">${esc([C.brand.boothName, C.brand.eventName].filter(Boolean).join(" · "))}</div>
      <div class="title"><i data-icon="zap"></i> ${APP.title(C.hackathon.name)}</div>
      <div class="place">إعلان الفائزين بالمركز الأول في كل مسار</div>`;
    return;
  }
  if (step <= n) {
    const f = F[step - 1], t = C.hackathon.tracks.find(x => x.id === f.track);
    s.innerHTML = `<div class="kicker">${glyph(t?.icon)} مسار ${esc(f.trackTitle)}</div>
      <div class="place p1">المركز الأول</div>
      <div class="medal">${MEDAL[0]}</div>
      <div class="team">${esc(f.team)}</div>
      <div class="proj">«${esc(f.title)}»</div>
      <div class="mem">${esc((f.members||[]).join(" · "))}</div>
      <div class="score">الدرجة النهائية <b>${f.final}</b></div>`;
    confetti();
    return;
  }
  s.innerHTML = `<div class="title" style="font-size:3.4vw"><i data-icon="trophy"></i> الفائزون في ${esc(C.hackathon.name)}</div>
    <div class="podium" style="grid-template-columns:repeat(${Math.min(F.length,4)},1fr);align-items:stretch">${F.map(f=>`<div class="pc first"><div class="m">${MEDAL[0]}</div><span>${esc(f.trackTitle)}</span><b>${esc(f.team)}</b><span>${esc(f.title)}</span><span class="gold" style="margin-top:.5vw">${f.final}</span></div>`).join("")}</div>
    <div class="kicker">شكرًا لجميع الفرق المشاركة</div>`;
  $("hint").textContent = "";
}
function next(){ if (!F.length) return; const max = (BY_TRACK ? F.length : Math.min(3,F.length))+1; if (step < max) { step++; render(); } }
function prev(){ if (step>0){ step--; render(); } }
document.addEventListener("keydown", e => { if ([" ","ArrowLeft","Enter","PageDown"].includes(e.key)) { e.preventDefault(); next(); } if (["ArrowRight","PageUp","Backspace"].includes(e.key)) prev(); });
$("stage").addEventListener("click", next);

function confetti(){
  const c=$("fx"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#2fb8a6","#e9c46a","#7fe3d4","#8fb3ff","#ffffff","#c9d1da"];
  const P=Array.from({length:220},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*6,c:cols[Math.random()*cols.length|0],vy:2+Math.random()*4,vx:-1.5+Math.random()*3,a:Math.random()*6,va:-.2+Math.random()*.4}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height);
    for(const p of P){ p.y+=p.vy; p.x+=p.vx; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore(); }
    if (++t<360) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
if (KEY) load().catch(()=>$("loginView").classList.remove("hidden")); else $("loginView").classList.remove("hidden");
</script>
</body>
</html>
