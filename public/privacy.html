<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سياسة الخصوصية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="icons.js"></script>
<script src="app.js"></script>
<style>.txt p{margin-bottom:12px;line-height:2}</style>
</head>
<body data-noannounce>
<header class="topbar"><div class="in">
  <div class="org"><span data-logo hidden></span><span data-text="brand.orgName"></span></div>
  <div class="mark"><i data-icon="shield-check"></i></div>
  <h1>سياسة الخصوصية</h1><p class="sub" data-text="brand.eventName"></p>
</div></header>
<div class="wrap">
  <div class="card">
    <div class="txt" id="txt"></div>
    <p class="muted small" id="contact"></p>
    <p style="margin-top:16px"><a class="btn ghost sm" href="javascript:history.back()"><i data-icon="arrow-right"></i> رجوع</a></p>
  </div>
</div>
<script>
APP.ready.then(c => {
  document.getElementById("txt").innerHTML = (c.privacy.text || "").split("\n").filter(Boolean).map(p => `<p>${APP.esc(p)}</p>`).join("");
  if (c.privacy.contact) document.getElementById("contact").textContent = "لطلبات الاطلاع على بياناتك أو حذفها: " + c.privacy.contact;
});
</script>
</body>
</html>
