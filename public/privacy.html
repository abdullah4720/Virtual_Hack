<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سياسة الخصوصية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hack.css">
<script src="app.js"></script>
<style>.txt p{margin-bottom:12px;line-height:2}</style>
</head>
<body data-noannounce>
<div class="wrap">
  <div class="card" style="margin-top:20px">
    <div data-logo hidden style="margin-bottom:8px"></div>
    <h1 style="font-size:24px">سياسة الخصوصية</h1>
    <p class="muted"><span data-text="brand.orgName"></span> · <span data-text="brand.eventName"></span></p>
    <div class="txt" id="txt" style="margin-top:16px"></div>
    <p class="muted small" id="contact"></p>
    <p style="margin-top:16px"><a class="btn ghost sm" href="javascript:history.back()">رجوع</a></p>
  </div>
</div>
<script>
APP.ready.then(c => {
  document.getElementById("txt").innerHTML = (c.privacy.text || "").split("\n").filter(Boolean).map(p => `<p>${APP.esc(p)}</p>`).join("");
  if (c.privacy.contact) document.getElementById("contact").textContent = "لطلبات الاطلاع على بياناتك أو حذفها: " + c.privacy.contact;
});
</script>
</body>
</html>
